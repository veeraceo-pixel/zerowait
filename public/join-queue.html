<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Join Queue | skipQs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#002f34;--accent:#23e5db;--bg:#f7f8f8;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);}
    .navbar{background:var(--primary);padding:1rem 0;color:white;}
    .nav-container{max-width:800px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-weight:800;font-size:1.5rem;color:var(--accent);text-decoration:none;}
    .nav-links a{color:white;text-decoration:none;font-size:.9rem;margin-left:15px;font-weight:600;}
    .content-area{display:flex;align-items:flex-start;justify-content:center;min-height:calc(100vh - 80px);padding:20px;}
    .card{background:white;padding:2rem;border-radius:1.5rem;box-shadow:0 10px 25px rgba(0,0,0,.05);width:100%;max-width:450px;text-align:center;}
    .wait-preview{background:#f0fdfc;padding:1rem;border-radius:1rem;margin-bottom:1.5rem;display:flex;justify-content:space-around;}
    .stat{display:block;font-size:1.5rem;font-weight:800;color:var(--primary);}
    .label{font-size:.7rem;color:#64748b;text-transform:uppercase;font-weight:600;}
    .svc-container{text-align:left;margin:1.5rem 0;border:1px solid #e2e8f0;border-radius:.8rem;overflow:hidden;}
    .svc-item{display:flex;align-items:center;padding:.8rem 1rem;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:.2s;}
    .svc-item:last-child{border-bottom:none;}
    .svc-item:hover{background:#f8fafc;}
    .svc-item input[type=checkbox]{width:20px;height:20px;margin-right:12px;cursor:pointer;accent-color:var(--primary);}
    .svc-info{flex:1;}
    .svc-name{display:block;font-weight:600;font-size:.95rem;color:#1e293b;}
    .svc-meta{font-size:.75rem;color:#64748b;}
    input[type=text],input[type=tel]{width:100%;padding:.8rem;border:1.5px solid #e2e8f0;border-radius:.5rem;font-size:1rem;margin-top:.8rem;outline:none;font-family:inherit;transition:border-color .2s;}
    input[type=text]:focus,input[type=tel]:focus{border-color:var(--accent);}
    .btn{width:100%;padding:1rem;background:var(--primary);color:white;border:none;border-radius:.5rem;font-weight:700;cursor:pointer;margin-top:1.2rem;transition:.3s;font-family:inherit;font-size:1rem;}
    .btn:disabled{background:#94a3b8;cursor:not-allowed;}
    .hidden{display:none;}
    .error-state{color:#dc2626;padding:1rem;background:#fee2e2;border-radius:.5rem;margin-bottom:1rem;font-size:.9rem;}
    .status-badge-green{background:#dcfce7;color:#166534;padding:.4rem 1rem;border-radius:2rem;font-size:.8rem;font-weight:bold;margin-bottom:1.5rem;display:inline-block;}
  </style>
  <link rel="stylesheet" href="mobile-fixes.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">skipQs</a>
    <div class="nav-links">
      <a href="index.html#categories">Find Services</a>
      <a href="login.html" id="authBtn">Login</a>
    </div>
  </div>
</nav>

<div class="content-area">
  <div class="card">
    <h2 id="bizName" style="margin-bottom:.5rem;color:#1e293b;">Loading…</h2>

    <div id="errorMessage" class="hidden error-state"></div>

    <div id="joinSection">
      <div class="wait-preview">
        <div><span class="label">People Ahead</span><span class="stat" id="aheadCount">0</span></div>
        <div><span class="label">Total Wait</span><span class="stat" id="estWait">0</span><span class="label">mins</span></div>
      </div>

      <p style="text-align:left;font-weight:700;font-size:.9rem;margin-bottom:-10px;color:#475569;">Select Services:</p>
      <div id="serviceChecklist" class="svc-container">
        <p style="padding:1rem;color:#94a3b8;font-size:.8rem;">Loading services…</p>
      </div>

      <input type="text" id="custName"  placeholder="Your Name" required>
      <input type="tel"  id="custPhone" placeholder="Mobile Number" required>
      <button onclick="handleCustomerJoin()" id="joinBtn" class="btn">Confirm & Join Queue</button>
    </div>

    <div id="statusSection" class="hidden">
      <div class="status-badge-green">YOU ARE IN LINE</div>
      <div style="font-size:4rem;font-weight:800;color:var(--primary);line-height:1;" id="liveWait">0</div>
      <p style="font-weight:600;color:#64748b;margin-top:.5rem;" id="liveWaitLabel">Estimated Minutes</p>
      <hr style="border:0;border-top:1px solid #f1f5f9;margin:1.5rem 0;">
      <div style="display:flex;justify-content:space-between;padding:0 10px;">
        <p style="margin:0;color:#64748b;">Your Position:</p>
        <p style="margin:0;font-weight:800;color:var(--primary);" id="livePos">—</p>
      </div>
      <p id="selectedSvcLabel" style="font-size:.9rem;color:#1e293b;margin-top:1rem;font-weight:600;"></p>
      <p style="font-size:.8rem;color:#94a3b8;margin-top:2rem;">Stay close! We'll update your position live.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>

<script>
  const params     = new URLSearchParams(window.location.search);
  const providerId = params.get('id') || params.get('provider');
  let businessName = '';
  let queueChannel;

  // Auth state → update nav button
  sb.auth.getSession().then(({ data: { session } }) => {
    const btn = document.getElementById('authBtn');
    if (session) { btn.textContent = 'Dashboard'; btn.href = 'dashboard.html'; }
  });

  window.onload = () => {
    if (!providerId) {
      // Hide the entire join form so it's not confusingly rendered alongside the error
      const joinSection = document.getElementById('joinSection');
      if (joinSection) joinSection.style.display = 'none';
      showError('No business ID found in the URL. Please scan a QR code or use a valid link. <a href="index.html" style="color:#dc2626;font-weight:700;text-decoration:underline;">Go to homepage →</a>');
      return;
    }
    fetchBusiness();
    fetchServices();
    previewQueue();
  };

  async function fetchBusiness() {
    const { data } = await sb.from('providers').select('business_name').eq('id', providerId).single();
    if (data) { businessName = data.business_name; document.getElementById('bizName').textContent = businessName; }
  }

  async function fetchServices() {
    const { data } = await sb.from('services').select('*').eq('provider_id', providerId).order('created_at');
    const container = document.getElementById('serviceChecklist');
    if (!data || !data.length) { container.innerHTML = "<p style='padding:1rem;color:#94a3b8;'>No services listed.</p>"; return; }
    container.innerHTML = '';
    data.forEach(s => {
      const item = document.createElement('div');
      item.className = 'svc-item';
      item.innerHTML = `
        <input type="checkbox" name="svc" value="${s.duration}" data-name="${esc(s.name)}">
        <div class="svc-info">
          <span class="svc-name">${esc(s.name)}</span>
          <span class="svc-meta">£${Number(s.price).toFixed(2)} · ${s.duration} mins</span>
        </div>`;
      item.onclick = (e) => { if (e.target.type !== 'checkbox') item.querySelector('input').click(); };
      container.appendChild(item);
    });
  }

  async function previewQueue() {
    // Simple poll — Supabase Realtime can also be used here
    const [{ data: biz }, { data: rows }] = await Promise.all([
      sb.from('providers').select('capacity').eq('id', providerId).single(),
      sb.from('queues').select('service_duration').eq('provider_id', providerId).in('status',['waiting','serving'])
    ]);
    const capacity  = biz?.capacity || 1;
    const totalMins = (rows||[]).reduce((s,r) => s + (r.service_duration||0), 0);
    document.getElementById('aheadCount').textContent = (rows||[]).length;
    document.getElementById('estWait').textContent    = Math.ceil(totalMins / capacity);
  }

  async function handleCustomerJoin() {
    const name  = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const boxes = document.querySelectorAll('input[name=svc]:checked');

    if (!boxes.length) { alert('Please select at least one service.'); return; }
    if (!name || !phone) { alert('Please enter your name and phone number.'); return; }

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      alert('Please log in to join the queue.');
      sessionStorage.setItem('redirectAfterLogin', window.location.href);
      window.location.href = 'login.html'; return;
    }

    const btn = document.getElementById('joinBtn');
    btn.disabled = true; btn.textContent = 'Joining…';

    // Check already in queue
    const { data: existing } = await sb.from('queues')
      .select('id').eq('provider_id', providerId).eq('user_id', session.user.id).eq('status','waiting').maybeSingle();
    if (existing) {
      alert('You are already in this queue!');
      btn.disabled = false; btn.textContent = 'Confirm & Join Queue'; return;
    }

    const svcNames    = Array.from(boxes).map(b => b.dataset.name).join(', ');
    const totalDur    = Array.from(boxes).reduce((s,b) => s + Number(b.value), 0);
    const currentWait = parseInt(document.getElementById('estWait').textContent) || 0;

    const { data: newRow, error } = await sb.from('queues').insert({
      user_id:          session.user.id,
      provider_id:      providerId,
      business_name:    businessName,
      customer_name:    name,
      customer_phone:   phone,
      selected_service: svcNames,
      service_duration: totalDur,
      status:           'waiting',
      joined_at:        new Date().toISOString(),
      estimated_time:   new Date(Date.now() + currentWait * 60000).toISOString()
    }).select().single();

    if (error) {
      // Duplicate key: user already has an active queue entry
      if (error.code === '23505' || /one_active_queue_per_user/.test(error.message)) {
        alert('You already have an active queue at another provider. Please leave that queue first from your dashboard before joining a new one.');
      } else {
        alert('Could not join queue: ' + error.message);
      }
      btn.disabled = false; btn.textContent = 'Confirm & Join Queue'; return;
    }
    startLiveTracking(newRow.id, svcNames);
  }

  function startLiveTracking(myQueueId, svcNames) {
    document.getElementById('joinSection').classList.add('hidden');
    document.getElementById('statusSection').classList.remove('hidden');
    document.getElementById('selectedSvcLabel').textContent = 'Services: ' + svcNames;

    if (queueChannel) sb.removeChannel(queueChannel);

    // Subscribe to ANY queue change for this provider (someone joins, leaves, completes)
    // This recalculates our real position + wait every time the queue moves
    queueChannel = sb.channel('queue-track:' + providerId)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'queues',
        filter: 'provider_id=eq.' + providerId
      }, () => refreshPosition(myQueueId))
      .subscribe();

    // Also subscribe to provider row — catches capacity changes and
    // emergency slowdowns (provider raises current_wait_mins manually)
    sb.channel('prov-track:' + providerId)
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'providers',
        filter: 'id=eq.' + providerId
      }, () => refreshPosition(myQueueId))
      .subscribe();

    refreshPosition(myQueueId);
  }

  async function refreshPosition(myQueueId) {
    const [{ data: biz }, { data: rows }] = await Promise.all([
      sb.from('providers').select('capacity').eq('id', providerId).single(),
      sb.from('queues').select('id,status,service_duration').eq('provider_id', providerId).in('status',['waiting','serving']).order('joined_at', { ascending: true })
    ]);
    const capacity = (biz?.capacity > 0) ? biz.capacity : 1;
    const docs     = rows || [];
    const myIndex  = docs.findIndex(d => d.id === myQueueId);

    if (myIndex === -1) {
      // Check if completed
      const { data: mine } = await sb.from('queues').select('status').eq('id', myQueueId).single();
      if (mine?.status === 'completed') {
        document.getElementById('statusSection').innerHTML = `
          <div style="padding:2rem;text-align:center;">
            <h2 style="color:#059669;font-size:2rem;">All done! 🎉</h2>
            <p style="color:#64748b;margin-top:.5rem;">Thank you for using skipQs.</p>
            <button onclick="location.reload()" class="btn" style="margin-top:1.5rem;">New Booking</button>
          </div>`;
        if (queueChannel) sb.removeChannel(queueChannel);
      }
      return;
    }

    document.getElementById('livePos').textContent = myIndex + 1;
    const myData = docs[myIndex];

    if (myData.status === 'serving') {
      document.getElementById('liveWait').textContent = '0';
      document.getElementById('liveWaitLabel').textContent = "You're up!";
    } else if (myIndex < capacity) {
      document.getElementById('liveWait').textContent = '0';
      document.getElementById('liveWaitLabel').textContent = "You're next!";
    } else {
      let minsAhead = 0;
      for (let i = 0; i < myIndex; i++) {
        const d = Number(docs[i].service_duration);
        minsAhead += (d > 0) ? d : 15;
      }
      document.getElementById('liveWait').textContent = Math.ceil(minsAhead / capacity);
      document.getElementById('liveWaitLabel').textContent = 'Estimated Minutes';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMessage');
    el.textContent = msg; el.classList.remove('hidden');
  }
  function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
</script>
</body>
</html>
