<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My queues | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="sq-header">
    <div class="sq-container sq-header-inner">
      <div class="sq-logo">skip<span>Qs</span></div>
      <nav class="sq-nav">
        <a href="/find-services.html">Find services</a>
        <a href="/my-queues.html" class="active">My queues</a>
      </nav>
      <div class="sq-header-actions">
        <button id="logout-btn" class="sq-btn sq-btn-ghost">Log out</button>
      </div>
    </div>
  </header>

  <main class="sq-main">
    <section class="sq-section">
      <div class="sq-container">
        <h1>My queues</h1>
        <p class="sq-subtle">Track your position and estimated wait time.</p>

        <div id="my-queues-list" class="sq-queue-list"></div>
        <div id="my-queues-empty" class="sq-empty-state" hidden>
          <h3>No active queues</h3>
          <p>When you join a queue, it will appear here.</p>
          <a href="/find-services.html" class="sq-btn sq-btn-primary">Find services</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { getMyQueues, computeEtaMinutes, logout } from './api.js';

    const listEl = document.getElementById('my-queues-list');
    const emptyEl = document.getElementById('my-queues-empty');
    const logoutBtn = document.getElementById('logout-btn');

    logoutBtn.addEventListener('click', async () => {
      await logout();
      window.location.href = '/';
    });

    async function renderMyQueues() {
      const user = await window.sqGetCurrentUser();
      if (!user) {
        window.location.href = '/login.html';
        return;
      }

      const queues = await getMyQueues(user.id);
      listEl.innerHTML = '';

      if (!queues.length) {
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;

      queues.forEach((q) => {
        const card = document.createElement('article');
        card.className = 'sq-queue-card';

        const etaMinutes =
          q.service_duration && q.position_in_queue != null
            ? computeEtaMinutes(q.position_in_queue, q.service_duration)
            : q.service_duration || 0;

        card.innerHTML = `
          <header class="sq-queue-card-header">
            <h3>${q.business_name}</h3>
            <span class="sq-badge">${q.selected_service || 'Service'}</span>
          </header>
          <p class="sq-subtle">Joined at ${new Date(q.joined_at).toLocaleTimeString()}</p>
          <div class="sq-queue-status">
            <div>
              <span class="sq-label">Position</span>
              <span class="sq-value">${q.position_in_queue ?? '—'}</span>
            </div>
            <div>
              <span class="sq-label">Estimated wait</span>
              <span class="sq-value">${etaMinutes} mins</span>
            </div>
            <div>
              <span class="sq-label">Status</span>
              <span class="sq-value">${q.status}</span>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    renderMyQueues();
    setInterval(renderMyQueues, 30_000);
  </script>
</body>
</html>
