<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Registration | skipQs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#002f34;
  --accent:#23e5db;
  --bg:#f7f8f8;
  --border:#e2e8f0;
  --white:#fff;
  --danger:#dc2626;
  --success:#059669;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--primary); }
.navbar {
  background:var(--primary);
  padding:1rem 2rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo { font-size:1.5rem; font-weight:800; color:var(--accent); text-decoration:none; }
.auth-wrapper { max-width:700px; margin:2rem auto; padding:0 1rem 5rem; }
.title { font-size:2rem; font-weight:800; margin-bottom:.5rem; }
.subtitle { color:#64748b; margin-bottom:2rem; }
.card { background:#fff; border-radius:18px; padding:1.6rem; margin-bottom:1.4rem; border:1px solid var(--border); }
.step { font-size:.75rem; color:var(--accent); font-weight:800; margin-bottom:.5rem; text-transform:uppercase; }
.heading { font-size:1.15rem; font-weight:700; margin-bottom:1.2rem; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
.group { display:flex; flex-direction:column; gap:.4rem; }
label { font-size:.85rem; font-weight:600; }
input, select {
  padding:.9rem 1rem;
  border-radius:12px;
  border:1.5px solid var(--border);
  font-family:inherit;
  font-size:.95rem;
}
input:focus, select:focus { outline:none; border-color:var(--accent); }
.geo { display:flex; gap:.6rem; }
.geo input { flex:1; }
.lookup-btn {
  background:var(--primary);
  color:white;
  border:none;
  border-radius:12px;
  padding:0 1rem;
  cursor:pointer;
  font-weight:700;
}
.success-msg { color:var(--success); font-size:.85rem; margin-top:.5rem; display:none; }
.error-msg {
  background:#fee2e2;
  color:#b91c1c;
  padding:1rem;
  border-radius:12px;
  margin-bottom:1rem;
  display:none;
}
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:.75rem; color:#64748b; padding-bottom:.6rem; }
td { padding:.45rem 0; }
.delete-btn { background:none; border:none; color:red; cursor:pointer; font-size:1.2rem; }
.add-service { margin-top:1rem; background:none; border:none; color:var(--primary); font-weight:700; cursor:pointer; }
.submit-btn {
  width:100%;
  background:var(--primary);
  color:white;
  border:none;
  padding:1rem;
  border-radius:14px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.submit-btn:disabled { opacity:.7; cursor:not-allowed; }
.spinner {
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}
@keyframes spin { to { transform:rotate(360deg); } }
@media(max-width:640px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">skipQs</a>
</header>

<main class="auth-wrapper">
  <div class="title">Register Your Business</div>
  <div class="subtitle">Launch your virtual queue in minutes.</div>

  <div id="errorMsg" class="error-msg"></div>

  <div class="card">
    <div class="step">STEP 1</div>
    <div class="heading">Business Details</div>
    <div class="row">
      <div class="group">
        <label>Business Name</label>
        <input type="text" id="bizName" placeholder="City Barbers">
      </div>
      <div class="group">
        <label>Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option>Barber</option>
          <option>Salon</option>
          <option>Clinic</option>
          <option>Restaurant</option>
          <option>Gym</option>
          <option>Pharmacy</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="group">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="447900123456">
      </div>
      <div class="group">
        <label>Capacity</label>
        <input type="number" id="capacity" value="1" min="1">
      </div>
    </div>
    <div class="group">
      <label>Business Address</label>
      <div class="geo">
        <input type="text" id="addressInput" placeholder="25 King Street, Manchester">
        <button class="lookup-btn" onclick="geocodeAddress()">Look Up</button>
      </div>
      <div id="geoResult" class="success-msg"></div>
      <input type="hidden" id="lat">
      <input type="hidden" id="lng">
    </div>
  </div>

  <div class="card">
    <div class="step">STEP 2</div>
    <div class="heading">Login Credentials</div>
    <div class="row">
      <div class="group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@business.com">
      </div>
      <div class="group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="step">STEP 3</div>
    <div class="heading">Services</div>
    <table>
      <thead>
        <tr>
          <th>Service</th>
          <th>Duration (mins)</th>
          <th>Price (£)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="svcBody"></tbody>
    </table>
    <button class="add-service" onclick="addRow()">+ Add Service</button>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="register()">
    <span class="spinner" id="spinner"></span>
    <span id="btnText">Complete Registration</span>
  </button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let isSubmitting = false;

async function geocodeAddress() {
  const address = document.getElementById('addressInput').value.trim();
  if (!address) return;
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.length) { showError('Address not found.'); return; }
    document.getElementById('lat').value = data[0].lat;
    document.getElementById('lng').value = data[0].lon;
    const geoResult = document.getElementById('geoResult');
    geoResult.style.display = 'block';
    geoResult.textContent = '✓ Address verified';
  } catch(err) {
    showError('Address lookup failed');
  }
}

function addRow(name='', duration='', price='') {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="s-name" placeholder="Haircut" value="${name}" style="width:100%"></td>
    <td><input class="s-dur" type="number" value="${duration}" placeholder="30" style="width:80px"></td>
    <td><input class="s-price" type="number" value="${price}" placeholder="15" style="width:80px"></td>
    <td><button class="delete-btn" onclick="this.closest('tr').remove()">×</button></td>
  `;
  document.getElementById('svcBody').appendChild(tr);
}
addRow();

function showError(msg) {
  const errDiv = document.getElementById('errorMsg');
  errDiv.textContent = msg;
  errDiv.style.display = 'block';
  errDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function register() {
  if (isSubmitting) return;
  document.getElementById('errorMsg').style.display = 'none';

  const bizName   = document.getElementById('bizName').value.trim();
  const category  = document.getElementById('category').value;
  const phone     = document.getElementById('phone').value.trim();
  const capacity  = parseInt(document.getElementById('capacity').value) || 1;
  const address   = document.getElementById('addressInput').value.trim();
  const lat       = parseFloat(document.getElementById('lat').value);
  const lng       = parseFloat(document.getElementById('lng').value);
  const email     = document.getElementById('email').value.trim().toLowerCase();
  const password  = document.getElementById('password').value;

  if (!bizName || !category || !phone || !address || !email || !password) {
    showError('Please complete all required fields.'); return;
  }
  if (!/^\+?[0-9]{10,15}$/.test(phone.replace(/\s/g, ''))) {
    showError('Please enter a valid phone number.'); return;
  }
  if (password.length < 6) {
    showError('Password must be at least 6 characters.'); return;
  }
  if (isNaN(lat) || isNaN(lng)) {
    showError('Please click "Look Up" to verify your address.'); return;
  }

  const rows = document.querySelectorAll('#svcBody tr');
  const services = Array.from(rows).map(tr => ({
    name:     tr.querySelector('.s-name').value.trim(),
    duration: parseInt(tr.querySelector('.s-dur').value) || 15,
    price:    parseFloat(tr.querySelector('.s-price').value) || 0
  })).filter(s => s.name);

  if (!services.length) { showError('Add at least one service.'); return; }

  const btn     = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  isSubmitting  = true;
  btn.disabled  = true;
  spinner.style.display = 'block';
  btnText.textContent   = 'Creating business...';

  try {
    // Check for duplicate email
    const { data: existingUsers } = await sb
      .from('providers')
      .select('email')
      .eq('email', email)
      .maybeSingle();
    if (existingUsers) throw new Error('Business already registered with this email.');

    // Create auth account
    const { data: authData, error: authErr } = await sb.auth.signUp({ email, password });
    if (authErr) throw authErr;
    const uid = authData.user.id;

    // Insert provider record
    const { error: providerErr } = await sb.from('providers').insert({
      id: uid, email, business_name: bizName, category, phone,
      address, lat, lng, capacity, is_open: true,
      current_wait_mins: 0, people_in_line: 0,
      created_at: new Date().toISOString()
    });
    if (providerErr) throw providerErr;

    // Insert services
    const { error: svcErr } = await sb.from('services').insert(
      services.map(s => ({ provider_id: uid, name: s.name, duration_mins: s.duration, price: s.price }))
    );
    if (svcErr) throw svcErr;

    btnText.textContent = 'Success! Redirecting...';
    setTimeout(() => { window.location.href = 'provider-dashboard.html'; }, 1800);
  } catch(err) {
    console.error(err);
    showError(err.message || 'Registration failed');
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Complete Registration';
    isSubmitting = false;
  }
}
</script>
</body>
</html>
