<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Provider sign up | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="sq-header">
    <div class="sq-container sq-header-inner">
      <div class="sq-logo">skip<span>Qs</span></div>
      <nav class="sq-nav">
        <a href="/find-services.html">Find services</a>
        <a href="/provider-dashboard.html">Provider dashboard</a>
      </nav>
      <div class="sq-header-actions">
        <a href="/login.html" class="sq-btn sq-btn-ghost">Log in</a>
      </div>
    </div>
  </header>

  <main class="sq-main">
    <section class="sq-section">
      <div class="sq-container sq-grid-2">
        <div>
          <h1>Join skipQs as a provider</h1>
          <p class="sq-subtle">
            Create your business account and start managing queues in minutes.
          </p>
          <ul class="sq-list">
            <li><strong>Real-time queues</strong> for your customers.</li>
            <li><strong>Less crowding</strong> in your waiting area.</li>
            <li><strong>Better experience</strong> and reviews.</li>
          </ul>
        </div>

        <div class="sq-card">
          <h2>Create provider account</h2>
          <form id="provider-signup-form" class="sq-form">
            <label>
              <span>Business name</span>
              <input type="text" name="business_name" required />
            </label>
            <label>
              <span>Category</span>
              <input type="text" name="category" placeholder="Salon, clinic, bank…" required />
            </label>
            <label>
              <span>Address</span>
              <input type="text" name="address" required />
            </label>
            <label>
              <span>Phone</span>
              <input type="tel" name="phone" />
            </label>
            <label>
              <span>Capacity (people served at once)</span>
              <input type="number" name="capacity" min="1" value="1" required />
            </label>
            <label>
              <span>Email</span>
              <input type="email" name="email" required />
            </label>
            <label>
              <span>Password</span>
              <input type="password" name="password" minlength="6" required />
            </label>
            <button type="submit" class="sq-btn sq-btn-primary">Create account</button>
            <p id="provider-signup-message" class="sq-form-message"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { providerSignup } from './api.js';

    const form = document.getElementById('provider-signup-form');
    const msg = document.getElementById('provider-signup-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'sq-form-message';

      const data = Object.fromEntries(new FormData(form).entries());
      msg.textContent = 'Creating your account…';

      const result = await providerSignup(data);
      if (result.error) {
        msg.textContent = result.error;
        msg.classList.add('error');
      } else {
        msg.textContent = 'Account created. Redirecting to dashboard…';
        msg.classList.add('success');
        setTimeout(() => {
          window.location.href = '/provider-dashboard.html';
        }, 1200);
      }
    });
  </script>
</body>
</html>
