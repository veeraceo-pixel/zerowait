<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Queues | skipQs</title>
  <meta name="theme-color" content="#002f34">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#002f34;--accent:#23e5db;--accent2:#ffce32;--bg:#f7f8f8;--border:#e2e8f0;--success:#059669;--danger:#dc2626;--warning:#d97706;--text-muted:#406367;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--primary);line-height:1.55;}
    /* ── NAV ── */
    .nav-bar{background:var(--primary);padding:.9rem 1.5rem;display:flex;justify-content:space-between;align-items:center;}
    .nav-logo{color:white;font-size:1.5rem;font-weight:800;text-decoration:none;letter-spacing:-1px;}
    .nav-logo span{color:var(--accent);}
    .nav-right{display:flex;gap:.8rem;align-items:center;}
    .nav-link{color:rgba(255,255,255,.8);text-decoration:none;font-size:.85rem;font-weight:600;}
    .nav-link:hover{color:white;}
    .nav-btn{background:rgba(255,255,255,.15);color:white;border:none;padding:.45rem .9rem;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;}
    .nav-btn:hover{background:rgba(255,255,255,.25);}
    /* ── LAYOUT ── */
    .page-wrap{max-width:780px;margin:2rem auto;padding:0 1rem 5rem;}
    /* ── ACTIVE QUEUE CARD ── */
    .active-queue-card{
      background:linear-gradient(135deg,#002f34 0%,#005959 100%);
      color:white;border-radius:18px;padding:1.6rem;margin-bottom:1.4rem;
      display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;
      border:2px solid rgba(35,229,219,.3);
    }
    .aqc-icon{font-size:2.4rem;flex-shrink:0;}
    .aqc-info{flex:1;min-width:180px;}
    .aqc-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:.2rem;}
    .aqc-title{font-size:1.15rem;font-weight:800;letter-spacing:-.3px;margin-bottom:.1rem;}
    .aqc-sub{font-size:.82rem;color:rgba(255,255,255,.65);}
    .aqc-timer{text-align:center;padding:.6rem 1.2rem;border-left:1px solid rgba(255,255,255,.12);}
    .aqc-timer-val{font-size:2.6rem;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
    .aqc-timer-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.45);font-weight:700;margin-top:.1rem;}
    .aqc-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
    .aqc-btn{padding:.55rem 1rem;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none;border:none;font-family:inherit;display:inline-block;}
    .aqc-btn-primary{background:var(--accent);color:var(--primary);}
    .aqc-btn-primary:hover{background:#1bcabf;}
    .aqc-btn-ghost{background:rgba(255,255,255,.12);color:white;}
    .aqc-btn-ghost:hover{background:rgba(255,255,255,.2);}
    .live-pill{display:inline-flex;align-items:center;gap:.35rem;background:rgba(16,185,129,.85);padding:3px 10px;border-radius:50px;font-size:.65rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-bottom:.5rem;}
    .live-dot{width:6px;height:6px;border-radius:50%;background:white;animation:pulse 1.4s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
    /* ── SECTION HEADER ── */
    .page-header{margin-bottom:1.4rem;}
    .page-header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.5px;}
    .page-header p{color:var(--text-muted);font-size:.92rem;margin-top:.3rem;}
    /* ── TABS ── */
    .tabs{display:flex;gap:.5rem;margin-bottom:1.4rem;}
    .tab-btn{padding:.55rem 1.4rem;border-radius:2rem;border:1.5px solid var(--border);background:white;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--text-muted);transition:.2s;}
    .tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
    /* ── LOADING ── */
    .loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;color:var(--text-muted);}
    .spinner{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem;}
    @keyframes spin{to{transform:rotate(360deg);}}
    /* ── QUEUE CARDS ── */
    .queue-card{
      background:white;border-radius:14px;border:1px solid var(--border);
      padding:1.2rem 1.4rem;margin-bottom:1rem;
      display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;
      transition:.2s;
    }
    .queue-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.06);}
    .qc-left{flex:1;min-width:0;}
    .qc-biz{font-weight:700;font-size:1rem;margin-bottom:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .qc-dept{font-size:.82rem;color:var(--text-muted);margin-bottom:.3rem;}
    .qc-date{font-size:.72rem;color:rgba(0,0,0,.35);margin-bottom:.6rem;}
    .qc-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
    .qc-btn{display:inline-block;padding:.4rem .85rem;border-radius:8px;font-size:.78rem;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:inherit;}
    .qc-btn-primary{background:var(--primary);color:white;}
    .qc-btn-primary:hover{background:#001f24;}
    .qc-btn-danger{background:#fee2e2;color:#b91c1c;}
    .qc-btn-danger:hover{background:#fecaca;}
    .qc-right{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;flex-shrink:0;}
    .status-badge{padding:.3rem .85rem;border-radius:2rem;font-size:.72rem;font-weight:700;white-space:nowrap;}
    .badge-waiting{background:#fef9c3;color:#854d0e;}
    .badge-serving{background:#dcfce7;color:#15803d;}
    .badge-completed{background:var(--border);color:#475569;}
    .badge-cancelled{background:#fee2e2;color:#b91c1c;}
    .qc-wait{text-align:right;}
    .qc-wait-val{font-size:1.6rem;font-weight:800;color:var(--primary);line-height:1;}
    .qc-wait-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);font-weight:700;}
    /* ── EMPTY ── */
    .empty-box{text-align:center;padding:4rem 2rem;color:var(--text-muted);}
    .empty-icon{font-size:3rem;margin-bottom:.8rem;}
    .empty-box h2{font-size:1.1rem;color:var(--primary);margin-bottom:.4rem;}
    .empty-box a{display:inline-block;margin-top:1rem;padding:.65rem 1.4rem;background:var(--primary);color:white;border-radius:10px;font-weight:700;text-decoration:none;font-size:.9rem;}
    /* ── TOAST ── */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--primary);color:white;padding:.9rem 1.4rem;border-radius:50px;font-weight:600;font-size:.9rem;z-index:2000;transition:.3s;opacity:0;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--danger);}
    /* ── LEAVE NOW BANNER ── */
    .leave-banner{border-radius:14px;padding:1rem 1.2rem;margin-bottom:1rem;display:none;align-items:center;gap:.9rem;flex-wrap:wrap;animation:slideIn .4s ease;}
    .leave-banner.go{background:linear-gradient(135deg,#064e3b,#065f46);border:1.5px solid #10b981;display:flex;}
    .leave-banner.soon{background:linear-gradient(135deg,#78350f,#92400e);border:1.5px solid #f59e0b;display:flex;}
    .leave-banner.tracking{background:rgba(0,47,52,.06);border:1.5px solid var(--border);display:flex;}
    .lb-icon{font-size:1.8rem;flex-shrink:0;}
    .lb-text{flex:1;min-width:160px;}
    .lb-title{font-weight:800;font-size:.95rem;margin-bottom:.15rem;}
    .leave-banner.go .lb-title,.leave-banner.go .lb-sub{color:white;}
    .leave-banner.soon .lb-title,.leave-banner.soon .lb-sub{color:white;}
    .leave-banner.tracking .lb-title{color:var(--primary);}
    .lb-sub{font-size:.78rem;opacity:.8;}
    .leave-banner.tracking .lb-sub{color:var(--text-muted);}
    .lb-dist{font-size:.72rem;font-weight:700;padding:.25rem .7rem;border-radius:50px;background:rgba(255,255,255,.15);color:white;white-space:nowrap;flex-shrink:0;}
    .leave-banner.tracking .lb-dist{background:var(--border);color:var(--text-muted);}
    @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:500px){.leave-banner{padding:.8rem 1rem;}.lb-icon{font-size:1.5rem;}}
  /* Auth gate: hide body until session check completes — prevents flash of unauth content */
  body.auth-pending { visibility: hidden; }
  </style>
  <link rel="stylesheet" href="mobile-fixes.css">
</head>
<body>
<script>
  // Hide body immediately; revealed once auth is confirmed (or redirect fires)
  document.body.classList.add('auth-pending');
</script>


<header class="nav-bar">
  <a href="index.html" class="nav-logo">skip<span>Qs</span></a>
  <div class="nav-right">
    <a href="nearby.html" class="nav-link">Find Services</a>
    <a href="hospitals.html" class="nav-link">Hospitals</a>
    <button class="nav-btn" onclick="doLogout()">Log out</button>
  </div>
</header>

<div class="page-wrap">

  <!-- ── LEAVE NOW TRAVEL BANNER ── -->
  <div class="leave-banner" id="leaveBanner">
    <div class="lb-icon" id="lbIcon">📍</div>
    <div class="lb-text">
      <div class="lb-title" id="lbTitle">Checking your location…</div>
      <div class="lb-sub"  id="lbSub"></div>
    </div>
    <span class="lb-dist" id="lbDist"></span>
  </div>

  <!-- ── ACTIVE QUEUE SECTION ── -->
  <div id="activeQueueArea"></div>

  <div class="page-header">
    <h1>My Queues</h1>
    <p>Track your position and estimated wait time.</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('active',this)">Active</button>
    <button class="tab-btn"        onclick="switchTab('history',this)">History</button>
  </div>

  <div id="listArea">
    <div class="loading-box"><div class="spinner"></div><p>Loading your queues…</p></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="notify.js"></script>
<script>
  let currentTab = 'active';
  let timerInterval = null;
  let currentUserId = null;

  function toast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(()=>{ t.className='toast'; }, 2500);
  }

  function esc(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }

  // ── INIT ──
  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (!session) { window.location.href = 'login.html'; return; }
    document.body.classList.remove('auth-pending'); // auth confirmed — show page

    // Guard: if this user is a provider, send them to their own dashboard
    // Check BOTH user_id (new registrations) AND id (legacy registrations)
    const _uid = session.user.id;
    const { data: prov } = await sb
      .from('providers')
      .select('is_hospital, category')
      .or(`user_id.eq.${_uid},id.eq.${_uid}`)
      .maybeSingle();

    if (prov) {
      const dest = (prov.is_hospital || prov.category === 'Hospital')
        ? 'hospital-dashboard.html'
        : 'provider-dashboard.html';
      window.location.replace(dest);
      return;
    }

    currentUserId = session.user.id;
    await loadActiveQueueBanner();
    loadTab('active');
  });

  // ── ACTIVE QUEUE BANNER WITH DYNAMIC POSITION-AWARE TIMER ──
  async function loadActiveQueueBanner() {
    const area = document.getElementById('activeQueueArea');
    const { data: rows } = await sb.from('queues')
      .select('id,status,provider_id,department_id,service_duration,joined_at')
      .eq('user_id', currentUserId)
      .in('status',['waiting','serving'])
      .limit(1);

    if (!rows || !rows.length) { area.innerHTML=''; return; }
    const q = rows[0];

    // Fetch provider (include lat/lng for travel alert, capacity for position math)
    const { data: prov } = await sb.from('providers').select('business_name,id,is_hospital,category,lat,lng,capacity,current_wait_mins').eq('id',q.provider_id).maybeSingle();
    // Fetch department
    let deptName = '', deptWaitMins = null;
    if (q.department_id) {
      const { data: dept } = await sb.from('departments').select('name,wait_minutes,avg_consult_minutes').eq('id',q.department_id).maybeSingle();
      if (dept) { deptName = dept.name; deptWaitMins = dept.wait_minutes; }
    }

    const bizName = prov ? prov.business_name : 'Your Queue';
    const isHosp = prov && (prov.is_hospital || prov.category === 'Hospital');
    const detailPage = prov ? (isHosp ? `hospital-detail.html?id=${prov.id}` : `business-detail.html?id=${prov.id}`) : '#';

    area.innerHTML = `
      <div class="active-queue-card" id="aqCard">
        <div class="aqc-icon">🎫</div>
        <div class="aqc-info">
          <div class="live-pill"><div class="live-dot"></div>Active</div>
          <div class="aqc-label">You are in the queue</div>
          <div class="aqc-title">${esc(bizName)}${deptName ? ' — ' + esc(deptName) : ''}</div>
          <div class="aqc-sub" id="aqStatus">${q.status === 'serving' ? '🔔 You are being served now!' : 'Waiting for your turn…'}</div>
          <div class="aqc-sub" id="aqPosition" style="font-size:.75rem;opacity:.7;margin-top:.2rem;"></div>
        </div>
        <div class="aqc-timer">
          <div class="aqc-timer-val" id="aqTimerVal">—</div>
          <div class="aqc-timer-lbl">min left</div>
        </div>
        <div class="aqc-actions">
          <a href="${detailPage}" class="aqc-btn aqc-btn-primary">View Details</a>
          <button class="aqc-btn aqc-btn-ghost" onclick="cancelQueue('${q.id}')">Leave Queue</button>
        </div>
      </div>`;

    // Calculate initial position-aware wait and start timer
    await recalcAndStartTimer(q, prov, deptWaitMins);

    // Start travel alert if provider has coordinates
    if (prov && prov.lat && prov.lng) {
      const initialMins = deptWaitMins !== null ? deptWaitMins : (prov.current_wait_mins || q.service_duration || 15);
      initTravelAlert(parseFloat(prov.lat), parseFloat(prov.lng), initialMins, q.joined_at);
    }

    // Ask for notification permission
    if (window.skipQsNotify) {
      window.skipQsNotify.init().then(() => {
        window.skipQsNotify.requestPermission();
        if (currentUserId) window.skipQsNotify.subscribePush(currentUserId);
      });
    }

    // ── REALTIME: my own queue row (status changes: serving / completed / cancelled)
    sb.channel('dash-queue-' + q.id)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'queues',filter:`id=eq.${q.id}`}, async payload => {
        if (['completed','cancelled','no_show'].includes(payload.new.status)) {
          area.innerHTML = '';
          if (timerInterval) clearInterval(timerInterval);
          if (travelCheckInterval) clearInterval(travelCheckInterval);
          loadTab(currentTab);
        } else if (payload.new.status === 'serving') {
          const el = document.getElementById('aqStatus');
          if (el) el.textContent = '🔔 You are being served now!';
          resetTimerToZero();
          if (window.skipQsNotify) {
            window.skipQsNotify.send(
              '🔔 Your turn — come in now!',
              `${bizName}${deptName ? ' — ' + deptName : ''} is ready for you.`,
              { tag: 'skipqs-serving', requireInteraction: true, url: '/dashboard.html' }
            );
          }
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              type: 'SHOW_QUEUE_NOTIFICATION', bizName, deptName, status: 'serving'
            });
          }
        }
      })
      .subscribe();

    // ── REALTIME: ANY queue change at this provider (someone joins, leaves, or completes)
    // This recalculates our real position in the queue and adjusts the timer dynamically.
    // This is the core fix for "previous patient finished early → timer speeds up"
    // and "patient taking longer → timer slows down".
    sb.channel('dash-provqueue-' + q.provider_id)
      .on('postgres_changes',{event:'*',schema:'public',table:'queues',filter:`provider_id=eq.${q.provider_id}`},
        async () => {
          // Skip if our own row was the one that changed to inactive
          const { data: mine } = await sb.from('queues').select('status').eq('id',q.id).maybeSingle();
          if (!mine || !['waiting','serving'].includes(mine.status)) return;
          await recalcAndStartTimer(q, prov, deptWaitMins);
        })
      .subscribe();

    // ── REALTIME: department wait_minutes (staff manually adjusts wait time)
    // Catches: doctor has emergency → staff raises wait → timer slows.
    // Catches: previous patients cancelled in bulk → staff lowers wait → timer speeds up.
    if (q.department_id) {
      sb.channel('dash-dept-' + q.department_id)
        .on('postgres_changes',{event:'UPDATE',schema:'public',table:'departments',filter:`id=eq.${q.department_id}`}, async payload => {
          deptWaitMins = payload.new.wait_minutes || 0;
          await recalcAndStartTimer(q, prov, deptWaitMins);
          if (deptWaitMins <= 3 && deptWaitMins > 0 && window.skipQsNotify && document.hidden) {
            window.skipQsNotify.send(
              '⏳ Almost your turn!',
              `Less than 3 minutes left at ${bizName}. Head over now!`,
              { tag: 'skipqs-queue', requireInteraction: false, url: '/dashboard.html' }
            );
          }
        })
        .subscribe();
    }

    // ── REALTIME: provider row (capacity change, or staff raises current_wait_mins for emergency)
    sb.channel('dash-prov-' + q.provider_id)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'providers',filter:`id=eq.${q.provider_id}`},
        async payload => {
          // Update our local prov reference with new capacity
          if (prov) {
            prov.capacity = payload.new.capacity || prov.capacity;
            prov.current_wait_mins = payload.new.current_wait_mins;
          }
          await recalcAndStartTimer(q, prov, deptWaitMins);
        })
      .subscribe();
  }

  /**
   * Queries the live queue for this provider, finds the user's real position,
   * calculates an accurate wait time, and restarts the countdown timer.
   *
   * Logic:
   *  - Count how many entries are ahead of us (joined before us, still active)
   *  - Sum their service_duration values
   *  - Divide by provider capacity (parallel serving slots)
   *  - If a department has a staff-set wait_minutes override, use that as the floor
   *
   * This means:
   *  • Someone ahead cancels → they drop off the list → our position moves up → timer speeds up ✓
   *  • Someone ahead takes longer → provider dashboard raises dept wait_minutes → timer slows ✓
   *  • Doctor has emergency → staff bumps dept wait_minutes → timer slows ✓
   *  • Capacity increases → same queue, more slots → timer speeds up ✓
   */
  async function recalcAndStartTimer(q, prov, deptWaitMins) {
    if (q.status === 'serving') { resetTimerToZero(); return; }

    const capacity = Math.max(1, prov?.capacity || 1);

    // Fetch everyone currently waiting or being served at this provider
    const { data: ahead } = await sb.from('queues')
      .select('id,joined_at,service_duration,status')
      .eq('provider_id', q.provider_id)
      .in('status', ['waiting','serving'])
      .order('joined_at', { ascending: true });

    const queue = ahead || [];
    const myIdx = queue.findIndex(r => r.id === q.id);

    let waitMins;

    if (myIdx <= 0) {
      // We're first (or only) in line — next to be served
      waitMins = 0;
    } else {
      // Sum durations of everyone ahead of us
      const aheadRows = queue.slice(0, myIdx);
      const totalAheadMins = aheadRows.reduce((sum, r) => sum + (Number(r.service_duration) || 15), 0);
      waitMins = Math.ceil(totalAheadMins / capacity);
    }

    // If staff has manually set a department wait override and it's larger than
    // our position-based estimate, respect it (emergency / unexpected slowdown)
    if (deptWaitMins !== null && deptWaitMins > waitMins) {
      waitMins = deptWaitMins;
    }

    // Update position display
    const posEl = document.getElementById('aqPosition');
    if (posEl && myIdx >= 0) {
      posEl.textContent = myIdx === 0
        ? 'You are next!'
        : `Position ${myIdx + 1} in queue`;
    }

    startTimer(waitMins);
  }

  function startTimer(minutes) {
    if (timerInterval) clearInterval(timerInterval);
    let remaining = Math.max(0, Math.round(minutes * 60));
    renderTimerVal(remaining);
    timerInterval = setInterval(() => {
      if (remaining > 0) remaining--;
      renderTimerVal(remaining);
    }, 1000);
  }

  function resetTimerToZero() {
    if (timerInterval) clearInterval(timerInterval);
    const el = document.getElementById('aqTimerVal');
    if (el) el.textContent = '✓';
  }

  function renderTimerVal(secs) {
    const el = document.getElementById('aqTimerVal');
    if (!el) return;
    const m = Math.floor(secs / 60);
    el.textContent = m > 0 ? String(m) : (secs > 0 ? '<1' : '✓');
  }

  async function cancelQueue(id) {
    if (!confirm('Leave this queue?')) return;

    // FIX: The old UNIQUE(user_id, status) constraint (now replaced by a partial
    // index on active statuses only) could cause a duplicate-key error (code 23505)
    // when a user already had a prior 'cancelled' row. We handle this gracefully:
    // if we hit a uniqueness violation, it means the DB schema hasn't been updated yet —
    // in that case we update the row to 'completed' instead, which is safe to do
    // for the purpose of removing the user from the active queue.
    const { error } = await sb
      .from('queues')
      .update({ status: 'cancelled' })
      .eq('id', id)
      .eq('user_id', currentUserId);

    if (error) {
      // Duplicate key: old broken constraint still present — fall back to 'completed'
      if (error.code === '23505' || /one_active_queue_per_user/.test(error.message)) {
        const { error: err2 } = await sb
          .from('queues')
          .update({ status: 'completed', completed_at: new Date().toISOString(), completed_date: new Date().toISOString().slice(0,10) })
          .eq('id', id)
          .eq('user_id', currentUserId);
        if (err2) {
          console.error('[skipQs] Leave queue fallback error:', err2);
          toast('Could not leave queue — please try again or contact support', 'error');
          return;
        }
        toast('You have left the queue ✓');
      } else {
        console.error('[skipQs] Leave queue error:', error);
        toast('Could not leave queue — ' + (error.message || 'permission denied'), 'error');
        return;
      }
    } else {
      toast('You have left the queue ✓');
    }

    document.getElementById('activeQueueArea').innerHTML = '';
    if (timerInterval) clearInterval(timerInterval);
    loadTab(currentTab);
  }

  // ── TABS ──
  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    loadTab(tab);
  }

  // ── LOAD QUEUE LIST ──
  async function loadTab(tab) {
    const list = document.getElementById('listArea');
    list.innerHTML = '<div class="loading-box"><div class="spinner"></div><p>Loading…</p></div>';

    let query = sb.from('queues')
      .select('id,status,provider_id,department_id,service_duration,joined_at')
      .eq('user_id', currentUserId);

    if (tab === 'active') {
      query = query.in('status',['waiting','serving']).order('joined_at',{ascending:false});
    } else {
      query = query.in('status',['completed','cancelled','no_show']).order('joined_at',{ascending:false}).limit(50);
    }

    const { data, error } = await query;
    if (error) { list.innerHTML=`<div class="empty-box"><div class="empty-icon">⚠️</div><h2>${esc(error.message)}</h2></div>`; return; }
    if (!data || !data.length) {
      list.innerHTML = `
        <div class="empty-box">
          <div class="empty-icon">${tab==='active'?'📋':'🕐'}</div>
          <h2>${tab==='active'?'No active queues':'No history yet'}</h2>
          <p>${tab==='active'?'Join a queue and it will appear here.':'Your completed queues will show here.'}</p>
          <a href="nearby.html">Find Services →</a>
        </div>`; return;
    }

    // Enrich with provider + department names
    const provIds = [...new Set(data.map(d=>d.provider_id).filter(Boolean))];
    const deptIds = [...new Set(data.map(d=>d.department_id).filter(Boolean))];

    const [provRes, deptRes] = await Promise.all([
      provIds.length ? sb.from('providers').select('id,business_name,is_hospital,category').in('id',provIds) : { data:[] },
      deptIds.length ? sb.from('departments').select('id,name,wait_minutes').in('id',deptIds) : { data:[] }
    ]);

    const provMap = {};
    (provRes.data||[]).forEach(p => { provMap[p.id]=p; });
    const deptMap = {};
    (deptRes.data||[]).forEach(d => { deptMap[d.id]=d; });

    list.innerHTML = data.map(q => {
      const prov = provMap[q.provider_id];
      const dept = deptMap[q.department_id];
      const bizName = prov ? prov.business_name : 'Service Provider';
      const deptName = dept ? dept.name : '';
      const waitMins = dept ? (dept.wait_minutes||0) : (q.service_duration||0);
      const isHosp = prov && (prov.is_hospital || prov.category === 'Hospital');
      const detailPage = prov ? (isHosp ? `hospital-detail.html?id=${prov.id}` : `business-detail.html?id=${prov.id}`) : '#';
      const date = q.joined_at ? new Date(q.joined_at).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}) : '';
      const badgeCls = q.status==='waiting'?'badge-waiting':q.status==='serving'?'badge-serving':q.status==='completed'?'badge-completed':'badge-cancelled';
      const label = q.status.charAt(0).toUpperCase()+q.status.slice(1);

      return `
        <div class="queue-card">
          <div class="qc-left">
            <div class="qc-biz">${esc(bizName)}</div>
            ${deptName ? `<div class="qc-dept">🏥 ${esc(deptName)}</div>` : ''}
            <div class="qc-date">${date}</div>
            ${['waiting','serving'].includes(q.status) ? `
            <div class="qc-actions">
              <a href="${detailPage}" class="qc-btn qc-btn-primary">View Wait Times</a>
              <button class="qc-btn qc-btn-danger" onclick="cancelQueue('${q.id}')">Leave Queue</button>
            </div>` : ''}
          </div>
          <div class="qc-right">
            <span class="status-badge ${badgeCls}">${label}</span>
            ${['waiting','serving'].includes(q.status) ? `
            <div class="qc-wait">
              <div class="qc-wait-val">${waitMins}</div>
              <div class="qc-wait-lbl">min wait</div>
            </div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  /* ══════════════════════════════════════════════
     LEAVE NOW — SMART TRAVEL ALERT
     Uses browser Geolocation + Haversine formula.
     No external API needed — completely free.
  ══════════════════════════════════════════════ */
  let travelCheckInterval = null;
  let travelAlertDismissed = false;

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2
            + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function estimateTravelMins(km) {
    // < 0.4 km → walking @ 5 km/h
    // 0.4–3 km → brisk walk / bike @ 12 km/h
    // > 3 km  → driving @ 25 km/h (conservative urban)
    if (km < 0.4)  return Math.ceil(km / 5  * 60);
    if (km < 3)    return Math.ceil(km / 12 * 60);
    return              Math.ceil(km / 25 * 60);
  }

  function remainingMins(waitMins, joinedAt) {
    const elapsed = joinedAt
      ? Math.floor((Date.now() - new Date(joinedAt).getTime()) / 1000 / 60)
      : 0;
    return Math.max(0, waitMins - elapsed);
  }

  function updateLeaveBanner(km, travelMins, remMins) {
    const banner = document.getElementById('leaveBanner');
    const icon   = document.getElementById('lbIcon');
    const title  = document.getElementById('lbTitle');
    const sub    = document.getElementById('lbSub');
    const dist   = document.getElementById('lbDist');

    if (travelAlertDismissed) { banner.style.display = 'none'; return; }

    const distStr = km < 1
      ? Math.round(km * 1000) + ' m away'
      : km.toFixed(1) + ' km away';

    dist.textContent = distStr;

    if (remMins <= 0) {
      // Queue done
      banner.className = 'leave-banner';
      return;
    }

    if (travelMins >= remMins) {
      // 🚨 Leave NOW — travel time >= remaining wait
      banner.className = 'leave-banner go';
      icon.textContent  = '🚗';
      title.textContent = 'Leave now to arrive just in time!';
      sub.textContent   = `You're ${distStr}. Travel time ~${travelMins} min, wait left ~${remMins} min.`;
      // Vibrate on mobile
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      // Push notification (works on locked screen if SW is running)
      if (window.skipQsNotify) {
        window.skipQsNotify.send(
          '🚗 Leave now!',
          `You're ${distStr} away. Travel time ~${travelMins} min, wait left ~${remMins} min.`,
          { tag: 'skipqs-travel', requireInteraction: false, url: '/dashboard.html' }
        );
      }
    } else if (travelMins >= remMins - 5) {
      // ⚠️ Leave soon — within 5 min buffer
      banner.className = 'leave-banner soon';
      icon.textContent  = '⏰';
      title.textContent = `Head over in ~${remMins - travelMins} min`;
      sub.textContent   = `Travel time ~${travelMins} min · Wait left ~${remMins} min · ${distStr}`;
    } else {
      // 📍 Tracking — everything fine
      banner.className = 'leave-banner tracking';
      icon.textContent  = '📍';
      title.textContent = 'Tracking your journey';
      sub.textContent   = `Leave in ~${remMins - travelMins} min · Travel time ~${travelMins} min · ${distStr}`;
    }
  }

  function initTravelAlert(bizLat, bizLng, waitMins, joinedAt) {
    if (!navigator.geolocation) return; // Browser doesn't support geo

    const banner = document.getElementById('leaveBanner');

    // Add dismiss button once
    if (!document.getElementById('lbDismiss')) {
      const btn = document.createElement('button');
      btn.id = 'lbDismiss';
      btn.textContent = '✕';
      btn.title = 'Dismiss';
      btn.style.cssText = 'background:none;border:none;color:rgba(255,255,255,.6);font-size:1rem;cursor:pointer;padding:.2rem .4rem;flex-shrink:0;align-self:flex-start;';
      btn.onclick = () => {
        travelAlertDismissed = true;
        banner.style.display = 'none';
        if (travelCheckInterval) clearInterval(travelCheckInterval);
      };
      banner.appendChild(btn);
    }

    function check() {
      navigator.geolocation.getCurrentPosition(
        pos => {
          const km       = haversineKm(pos.coords.latitude, pos.coords.longitude, bizLat, bizLng);
          const travelM  = estimateTravelMins(km);
          const remM     = remainingMins(waitMins, joinedAt);
          updateLeaveBanner(km, travelM, remM);
        },
        _err => {
          // Geo denied or unavailable — hide banner silently
          banner.style.display = 'none';
          if (travelCheckInterval) clearInterval(travelCheckInterval);
        },
        { timeout: 8000, maximumAge: 60000 }
      );
    }

    // First check immediately, then every 90 seconds
    check();
    if (travelCheckInterval) clearInterval(travelCheckInterval);
    travelCheckInterval = setInterval(check, 90000);
  }

  function doLogout() {
    sb.auth.signOut().then(() => window.location.href = 'index.html');
  }
</script>
