<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Queues | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#002f34;--accent:#23e5db;--bg:#f7f8f8;--text:#002f34;--muted:#406367;--border:#e2e8f0;--green:#059669;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .navbar{background:var(--primary);padding:16px 0;box-shadow:0 2px 10px rgba(0,0,0,.15);}
    .nav-inner{max-width:900px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-weight:800;font-size:1.4rem;color:white;text-decoration:none;letter-spacing:-0.5px;}
    .logo span{color:var(--accent);}
    .nav-links{display:flex;gap:16px;align-items:center;}
    .nav-links a{color:rgba(255,255,255,.8);text-decoration:none;font-size:0.875rem;font-weight:600;transition:.2s;}
    .nav-links a:hover{color:white;}
    .page-wrap{max-width:900px;margin:0 auto;padding:30px 20px;}
    .page-header{margin-bottom:28px;}
    .page-header h1{font-size:1.75rem;font-weight:800;margin-bottom:4px;}
    .page-header p{color:var(--muted);font-size:0.95rem;}
    .tabs{display:flex;gap:4px;background:white;border-radius:10px;padding:6px;border:1px solid var(--border);margin-bottom:24px;max-width:360px;}
    .tab{flex:1;padding:8px 16px;border:none;background:transparent;border-radius:7px;font-weight:600;font-size:0.85rem;cursor:pointer;color:var(--muted);transition:.2s;}
    .tab.active{background:var(--primary);color:white;}
    .visit-card{background:white;padding:20px;border-radius:12px;margin-bottom:12px;border:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;transition:.2s;}
    .visit-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.06);}
    .visit-biz{font-weight:700;font-size:1rem;margin-bottom:4px;}
    .visit-meta{font-size:0.8rem;color:var(--muted);}
    .visit-svc{font-size:0.85rem;color:var(--text);font-weight:600;margin-top:4px;}
    .visit-actions{display:flex;gap:8px;margin-top:12px;}
    .btn-track{padding:7px 18px;background:var(--primary);color:white;border:none;border-radius:50px;font-size:0.8rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
    .btn-track:hover{background:#004050;}
    .status-badge{font-size:0.72rem;font-weight:700;padding:5px 14px;border-radius:50px;white-space:nowrap;flex-shrink:0;}
    .waiting{background:#fef3c7;color:#92400e;}
    .serving{background:#dcfce7;color:#166534;}
    .completed{background:#f1f5f9;color:#64748b;}
    .empty-box{text-align:center;padding:60px 20px;color:var(--muted);}
    .empty-box .icon{font-size:56px;margin-bottom:16px;}
    .empty-box h2{font-size:1.25rem;font-weight:700;color:var(--text);margin-bottom:8px;}
    .empty-box a{display:inline-block;margin-top:16px;padding:12px 28px;background:var(--accent);color:var(--primary);border-radius:50px;font-weight:800;text-decoration:none;font-size:.9rem;}
    .loading-state{text-align:center;padding:40px;color:var(--muted);}
    .spinner-ring{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.visit-card{flex-direction:column;}.visit-actions{width:100%;}}
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">skip<span>Qs</span></a>
    <div class="nav-links">
      <a href="nearby.html">Find Services</a>
      <a href="#" id="logoutBtn" onclick="handleLogout(event)">Logout</a>
    </div>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>My Queues</h1>
    <p>Track your current and past queue visits.</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('active', this)">Active</button>
    <button class="tab" onclick="switchTab('history', this)">History</button>
  </div>

  <div id="visits-list">
    <div class="loading-state">
      <div class="spinner-ring"></div>
      <p>Loading your visits...</p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const db = firebase.firestore();
  let currentTab = 'active';
  let currentUid = null;

  firebase.auth().onAuthStateChanged(user => {
    if (!user || user.isAnonymous) {
      // Redirect to login — do NOT allow anonymous users to see dashboard
      sessionStorage.setItem('redirectAfterLogin', window.location.href);
      window.location.href = 'login.html';
      return;
    }
    currentUid = user.uid;
    loadVisits(currentUid, currentTab);
  });

  function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    loadVisits(currentUid, tab);
  }

  function loadVisits(uid, tab) {
    const list = document.getElementById('visits-list');
    list.innerHTML = '<div class="loading-state"><div class="spinner-ring"></div><p>Loading...</p></div>';

    let query = db.collection('queues').where('userId','==',uid).orderBy('joinedAt','desc');

    if (tab === 'active') {
      query = query.where('status','in',['waiting','serving']);
    } else {
      query = query.where('status','==','completed').limit(20);
    }

    query.onSnapshot(snap => {
      if (snap.empty) {
        list.innerHTML = `<div class="empty-box">
          <div class="icon">${tab==='active'?'📋':'🕐'}</div>
          <h2>${tab==='active'?'No active queues':'No history yet'}</h2>
          <p>${tab==='active'?'Find a nearby service and join a queue.':'Your completed visits will appear here.'}</p>
          <a href="nearby.html">Find Services Near Me</a>
        </div>`;
        return;
      }

      let html = '';
      snap.forEach(doc => {
        const d = doc.data();
        const date = d.joinedAt ? d.joinedAt.toDate().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}) : 'Just now';
        const sClass = d.status === 'waiting' ? 'waiting' : d.status === 'serving' ? 'serving' : 'completed';
        const sLabel = d.status === 'waiting' ? '⏳ Waiting' : d.status === 'serving' ? '✅ Being Served' : '✔ Completed';

        html += `<div class="visit-card">
          <div style="flex:1">
            <div class="visit-biz">${esc(d.businessName||'Service Provider')}</div>
            <div class="visit-svc">${esc(d.selectedService||'Services not listed')}</div>
            <div class="visit-meta">${date}</div>
            ${d.status !== 'completed' ? `<div class="visit-actions"><a href="join-queue.html?id=${d.providerId}" class="btn-track">Track Position →</a></div>` : ''}
          </div>
          <div class="status-badge ${sClass}">${sLabel}</div>
        </div>`;
      });
      list.innerHTML = html;
    }, err => {
      console.error(err);
      if (err.message && err.message.includes('index')) {
        list.innerHTML = `<div class="empty-box"><div class="icon">⚙️</div><h2>Index Setup Required</h2><p>Open browser console (F12) and click the Firestore index link to enable this view.</p></div>`;
      } else {
        list.innerHTML = `<div class="empty-box"><div class="icon">⚠️</div><h2>Error Loading Visits</h2><p>${err.message}</p></div>`;
      }
    });
  }

  function handleLogout(e) { e.preventDefault(); firebase.auth().signOut().then(() => window.location.href='index.html'); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
