<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | skipQs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#002f34;--accent:#23e5db;}
    body{font-family:'Inter',sans-serif;background:#f7f8f8;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;}
    .card{background:white;border-radius:1.5rem;padding:3rem 2.5rem;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.08);}
    .emoji{font-size:4rem;margin-bottom:1rem;}
    h1{font-size:5rem;font-weight:800;color:var(--primary);line-height:1;margin:0;}
    h2{font-size:1.3rem;font-weight:700;color:#1e293b;margin:.5rem 0 1rem;}
    p{color:#64748b;font-size:.95rem;line-height:1.6;margin-bottom:2rem;}
    .btn{display:inline-block;background:var(--primary);color:white;padding:.9rem 2rem;border-radius:50px;font-weight:700;text-decoration:none;font-size:.95rem;transition:.2s;}
    .btn:hover{background:#004050;}
    .btn-outline{display:inline-block;background:transparent;color:var(--primary);border:2px solid var(--primary);padding:.85rem 1.8rem;border-radius:50px;font-weight:700;text-decoration:none;font-size:.95rem;margin-left:.5rem;transition:.2s;}
    .btn-outline:hover{background:var(--primary);color:white;}
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🤔</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <a href="index.html" class="btn">Go Home</a>
    <a href="nearby.html" class="btn-outline">Find Services</a>
  </div>
</body>
</html>
