<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #002f34; --accent: #23e5db; --bg-light: #f7f8f8; --text-main: #002f34; --text-muted: #64748b; --white: #fff; --shadow: 0 10px 15px -3px rgba(0,0,0,.1); }
    body { font-family: 'Inter', sans-serif; background: var(--bg-light); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .navbar { background: var(--primary); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-decoration: none; }
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: var(--white); width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 1.25rem; box-shadow: var(--shadow); }
    .auth-header h1 { font-size: 1.8rem; margin: 0 0 .5rem; color: #0f172a; }
    .auth-header p { color: var(--text-muted); margin-bottom: 2rem; font-size: .95rem; }
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    .form-label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .5rem; }
    .form-control { width: 100%; padding: .8rem 1rem; box-sizing: border-box; border: 1.5px solid #cbd5e1; border-radius: .6rem; font-size: 1rem; transition: border-color .2s; }
    .form-control:focus { outline: none; border-color: var(--accent); }
    .btn-submit { width: 100%; background: var(--primary); color: white; padding: 1rem; border: none; border-radius: .6rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    .btn-submit:hover { opacity: .88; }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .auth-footer { margin-top: 1.5rem; text-align: center; font-size: .9rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .error-msg { background: #fee2e2; color: #b91c1c; border-radius: .5rem; padding: .75rem 1rem; font-size: .875rem; margin-bottom: 1rem; display: none; }
    .forgot { text-align: right; font-size: .8rem; margin-top: -.5rem; margin-bottom: 1rem; }
    .forgot a { color: var(--text-muted); text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }
    .divider { display:flex; align-items:center; gap:.8rem; margin:1.4rem 0; color:var(--text-muted); font-size:.82rem; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:#e2e8f0; }
    .btn-otp { width:100%; background:transparent; color:var(--primary); padding:.9rem; border:1.5px solid #cbd5e1; border-radius:.6rem; font-size:.95rem; font-weight:600; cursor:pointer; font-family:inherit; transition:.2s; display:flex; align-items:center; justify-content:center; gap:.5rem; }
    .btn-otp:hover { border-color:var(--accent); background:#f0fffe; }
    .otp-inline { display:none; margin-top:1rem; }
    .otp-row { display:flex; gap:.5rem; justify-content:center; margin:.8rem 0; }
    .otp-box { width:42px; height:50px; text-align:center; font-size:1.3rem; font-weight:700; border:2px solid #cbd5e1; border-radius:.6rem; font-family:inherit; transition:border-color .2s; }
    .otp-box:focus { outline:none; border-color:var(--accent); }
    .info-msg { background:#eff6ff; color:#1e40af; border-radius:.5rem; padding:.75rem 1rem; font-size:.875rem; margin-bottom:1rem; display:none; }
  </style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">skipQs</a>
</header>

<main class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Log in to access your account.</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="forgot"><a href="#" id="forgotLink">Forgot password?</a></div>
      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <!-- Customer magic-link / OTP section -->
    <div class="divider">or for customers</div>

    <div id="infoMsgOTP" class="info-msg"></div>

    <!-- Phase A: just show the button -->
    <div id="otpPhaseA">
      <button type="button" class="btn-otp" onclick="showOTPInput()">
        📧 Sign in with email code
      </button>
    </div>

    <!-- Phase B: email entry + send -->
    <div id="otpPhaseB" style="display:none;">
      <input type="email" id="otpEmail" class="form-control" placeholder="your@email.com" style="margin-bottom:.6rem;">
      <button type="button" class="btn-submit" id="otpSendBtn" onclick="sendCustomerOTP()">Send Code</button>
      <button type="button" style="width:100%;background:none;border:none;color:var(--text-muted);font-size:.85rem;margin-top:.5rem;cursor:pointer;font-family:inherit;" onclick="hideOTPInput()">← Back to password login</button>
    </div>

    <!-- Phase C: OTP code boxes -->
    <div id="otpPhaseC" style="display:none;">
      <p style="font-size:.85rem;color:var(--text-muted);text-align:center;margin-bottom:.3rem;">6-digit code sent to <strong id="otpEmailShow"></strong></p>
      <div class="otp-row">
        <input class="otp-box" id="l1" maxlength="1" inputmode="numeric">
        <input class="otp-box" id="l2" maxlength="1" inputmode="numeric">
        <input class="otp-box" id="l3" maxlength="1" inputmode="numeric">
        <input class="otp-box" id="l4" maxlength="1" inputmode="numeric">
        <input class="otp-box" id="l5" maxlength="1" inputmode="numeric">
        <input class="otp-box" id="l6" maxlength="1" inputmode="numeric">
      </div>
      <div id="otpErrInline" class="error-msg"></div>
      <button type="button" class="btn-submit" id="otpVerifyBtn" onclick="verifyCustomerOTP()">Verify &amp; Log In</button>
      <button type="button" style="width:100%;background:none;border:none;color:var(--text-muted);font-size:.85rem;margin-top:.5rem;cursor:pointer;font-family:inherit;" onclick="backToOTPEmail()">← Change email</button>
    </div>

    <div class="auth-footer" style="margin-top:1.2rem;">
      New here? <a href="signup.html">Create an account</a>
    </div>
    <div class="auth-footer" style="margin-top:.6rem;font-size:.82rem;">
      Registering a business? <a href="provider-signup.html">Sign up as a provider →</a>
    </div>
  </div>
</main>

<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>

<script>
  const errDiv  = document.getElementById('errorMsg');
  const btn     = document.getElementById('submitBtn');

  function showError(msg) { errDiv.textContent = msg; errDiv.style.display = 'block'; }
  function hideError()    { errDiv.style.display = 'none'; }

  async function redirectUser(session) {
    if (!session) return;
    try {
      // Check if this user is a registered provider (hospital or business)
      const { data: prov } = await sb
        .from('providers')
        .select('id, is_hospital, category')
        .eq('user_id', session.user.id)   // ← correct field
        .maybeSingle();

      const pending = sessionStorage.getItem('redirectAfterLogin');

      if (prov) {
        // Route to the right dashboard
        if (prov.category === 'Hospital' || prov.is_hospital === true) {
          window.location.replace('hospital-dashboard.html');
        } else {
          window.location.replace('business-dashboard.html');
        }
      } else if (pending) {
        sessionStorage.removeItem('redirectAfterLogin');
        window.location.replace(pending);
      } else {
        window.location.replace('dashboard.html'); // patient dashboard
      }
    } catch {
      window.location.replace('dashboard.html');
    }
  }

  // If already logged in, redirect immediately
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) redirectUser(session);
  });

  // Login form
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    hideError();
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      if (error.message.includes('Invalid login')) {
        showError('Incorrect email or password. Please try again.');
      } else {
        showError(error.message);
      }
      return;
    }
    redirectUser(data.session);
  };

  /* ===== CUSTOMER EMAIL OTP ===== */
  let otpTargetEmail = '';

  function showOTPInput() {
    document.getElementById('otpPhaseA').style.display = 'none';
    document.getElementById('otpPhaseB').style.display = 'block';
    document.getElementById('otpEmail').focus();
  }
  function hideOTPInput() {
    document.getElementById('otpPhaseA').style.display = 'block';
    document.getElementById('otpPhaseB').style.display = 'none';
    document.getElementById('otpPhaseC').style.display = 'none';
    document.getElementById('infoMsgOTP').style.display = 'none';
  }
  function backToOTPEmail() {
    document.getElementById('otpPhaseC').style.display = 'none';
    document.getElementById('otpPhaseB').style.display = 'block';
  }

  async function sendCustomerOTP() {
    const email = document.getElementById('otpEmail').value.trim().toLowerCase();
    if (!email) return;
    const btn = document.getElementById('otpSendBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
    btn.disabled = false; btn.textContent = 'Send Code';
    if (error) {
      // If user doesn't exist, redirect to signup
      if (error.message.toLowerCase().includes('not found') || error.message.toLowerCase().includes('signups')) {
        document.getElementById('infoMsgOTP').textContent = 'No account found. Please sign up first.';
        document.getElementById('infoMsgOTP').style.display = 'block';
        setTimeout(() => { window.location.href = 'signup.html'; }, 1800);
        return;
      }
      document.getElementById('infoMsgOTP').style.background='#fee2e2';
      document.getElementById('infoMsgOTP').style.color='#b91c1c';
      document.getElementById('infoMsgOTP').textContent = error.message;
      document.getElementById('infoMsgOTP').style.display = 'block';
      return;
    }
    otpTargetEmail = email;
    document.getElementById('otpEmailShow').textContent = email;
    document.getElementById('otpPhaseB').style.display = 'none';
    document.getElementById('otpPhaseC').style.display = 'block';
    // Wire up OTP boxes
    const lboxes = ['l1','l2','l3','l4','l5','l6'].map(id => document.getElementById(id));
    lboxes.forEach((box, i) => {
      box.oninput = e => {
        const val = e.target.value.replace(/\D/g,'');
        e.target.value = val;
        if (val && i < 5) lboxes[i+1].focus();
        if (lboxes.every(b => b.value)) verifyCustomerOTP();
      };
      box.onkeydown = e => { if (e.key==='Backspace' && !box.value && i>0) lboxes[i-1].focus(); };
    });
    lboxes[0].focus();
  }

  async function verifyCustomerOTP() {
    const lboxes = ['l1','l2','l3','l4','l5','l6'].map(id => document.getElementById(id));
    const code = lboxes.map(b => b.value).join('');
    if (code.length < 6) return;
    const btn = document.getElementById('otpVerifyBtn');
    btn.disabled = true; btn.textContent = 'Verifying…';
    const { data, error } = await sb.auth.verifyOtp({ email: otpTargetEmail, token: code, type: 'email' });
    if (error) {
      btn.disabled = false; btn.textContent = 'Verify & Log In';
      lboxes.forEach(b => { b.value=''; b.style.borderColor='#ef4444'; });
      document.getElementById('otpErrInline').textContent = 'Invalid or expired code. Try again.';
      document.getElementById('otpErrInline').style.display = 'block';
      lboxes[0].focus();
      return;
    }
    redirectUser(data.session);
  }

  // Forgot password
  document.getElementById('forgotLink').onclick = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) { showError('Enter your email address first.'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login.html'
    });
    if (error) { showError(error.message); return; }
    hideError();
    errDiv.style.background='#d1fae5'; errDiv.style.color='#065f46';
    errDiv.textContent='✓ Password reset email sent — check your inbox.';
    errDiv.style.display='block';
  };
</script>
</body>
</html>
