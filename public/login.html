<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { 
        --primary: #2563eb; 
        --bg-light: #f8fafc; 
        --text-main: #1e293b; 
        --text-muted: #64748b; 
        --white: #ffffff; 
        --success: #059669;
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    
    .navbar { background: var(--white); padding: 1rem 2rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }

    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
    
    .auth-card { 
        background: var(--white); 
        width: 100%; 
        max-width: 420px; 
        padding: 2.5rem; 
        border-radius: 1.5rem; 
        box-shadow: var(--shadow); 
        text-align: center;
        transition: transform 0.3s ease;
        position: relative;
        z-index: 10;
    }

    .auth-header h1 { font-size: 1.8rem; margin: 0 0 0.5rem 0; color: #0f172a; font-weight: 800; }
    .auth-header p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }

    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 1rem; box-sizing: border-box; border: 1.5px solid #e2e8f0; border-radius: 0.75rem; font-size: 1.1rem; transition: 0.2s; font-weight: 500; }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

    .btn-submit { 
        width: 100%; 
        background: var(--primary); 
        color: white; 
        padding: 1.1rem; 
        border: none; 
        border-radius: 0.75rem; 
        font-size: 1rem; 
        font-weight: 700; 
        cursor: pointer; 
        transition: 0.3s;
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }
    .btn-submit:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-submit:disabled { background: #94a3b8; transform: none; cursor: not-allowed; }

    .hidden { display: none; }

    /* Success Overlay */
    #success-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: var(--white); z-index: 100;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; animation: fadeIn 0.5s ease forwards;
    }

    .success-icon {
        width: 80px; height: 80px; background: #ecfdf5; color: var(--success);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; margin-bottom: 1.5rem;
        animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .timer-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem; }
    .resend-link { color: var(--primary); text-decoration: none; font-weight: 700; cursor: pointer; }
    .resend-link.disabled { color: var(--text-muted); cursor: not-allowed; opacity: 0.6; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">skipQs</a>
</header>

<main class="auth-wrapper">
  <div class="auth-card" id="main-card">
    <div class="auth-header">
      <h1 id="auth-title">Welcome Back</h1>
      <p id="auth-desc">Secure access via mobile OTP</p>
    </div>

    <div id="phone-step">
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="tel" id="phoneNumber" class="form-control" placeholder="+44 7123 456789">
      </div>
      <div id="recaptcha-container"></div>
      <button onclick="sendOTP()" class="btn-submit" id="sendBtn">Get Access Code</button>
    </div>

    <div id="otp-step" class="hidden">
      <div class="form-group">
        <label class="form-label">6-Digit Code</label>
        <input type="number" id="otpCode" class="form-control" placeholder="000000" style="letter-spacing: 8px; text-align: center;">
      </div>
      <button onclick="verifyOTP()" class="btn-submit" id="verifyBtn">Verify & Enter</button>
      
      <div class="timer-text" id="timer-container">
        Resend code in <span id="timer-sec">30</span>s
      </div>
      <div class="timer-text hidden" id="resend-container">
        Didn't get it? <span class="resend-link" onclick="sendOTP(true)">Resend SMS</span>
      </div>
    </div>
  </div>

  <div id="success-screen">
    <div class="success-icon">✓</div>
    <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem;">Access Granted</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">Welcome to the elite queueing experience.</p>
    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  let confirmationResult;
  let timerInterval;

  window.onload = function() {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
  };

  function startResendTimer() {
    let timeLeft = 30;
    document.getElementById('timer-container').classList.remove('hidden');
    document.getElementById('resend-container').classList.add('hidden');
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer-sec').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById('timer-container').classList.add('hidden');
        document.getElementById('resend-container').classList.remove('hidden');
      }
    }, 1000);
  }

  async function sendOTP(isResend = false) {
    const phone = document.getElementById('phoneNumber').value;
    const btn = document.getElementById('sendBtn');
    if (!phone) return alert("Enter phone number");

    if(!isResend) {
        btn.disabled = true;
        btn.innerText = 'Requesting Code...';
    }

    firebase.auth().signInWithPhoneNumber(phone, window.recaptchaVerifier)
      .then((result) => {
        confirmationResult = result;
        document.getElementById('phone-step').classList.add('hidden');
        document.getElementById('otp-step').classList.remove('hidden');
        document.getElementById('auth-title').innerText = "Verify Identity";
        startResendTimer();
      }).catch((error) => {
        alert(error.message);
        btn.disabled = false;
        btn.innerText = 'Get Access Code';
      });
  }

  async function verifyOTP() {
    const code = document.getElementById('otpCode').value;
    const btn = document.getElementById('verifyBtn');
    if (code.length !== 6) return alert("Enter 6 digits");

    btn.disabled = true;
    btn.innerText = 'Authorizing...';

    confirmationResult.confirm(code).then((result) => {
      showSuccess(result.user);
    }).catch((error) => {
      alert("Invalid code. Please try again.");
      btn.disabled = false;
      btn.innerText = 'Verify & Enter';
    });
  }

  function showSuccess(user) {
    document.getElementById('main-card').style.display = 'none';
    document.getElementById('success-screen').style.display = 'flex';
    
    setTimeout(async () => {
        try {
            const providerSnap = await firebase.firestore().collection('providers').doc(user.uid).get();
            window.location.replace(providerSnap.exists ? 'provider-dashboard.html' : 'index.html');
        } catch (err) {
            window.location.replace('index.html');
        }
    }, 2200);
  }

  firebase.auth().onAuthStateChanged((user) => {
    // Only auto-redirect if they aren't mid-OTP process
    if (user && !confirmationResult) {
        showSuccess(user);
    }
  });
</script>
</body>
</html>
