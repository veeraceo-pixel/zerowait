<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb;
      --bg-light: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --success: #059669;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --border: #e2e8f0;
      --radius: 0.75rem;
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }

    .auth-card {
      background: var(--white); width: 100%; max-width: 420px; padding: 2.5rem;
      border-radius: 1.5rem; box-shadow: var(--shadow); text-align: center;
      position: relative; animation: slideUp 0.4s ease-out; overflow: hidden;
    }

    .auth-header h1 { font-size: 1.8rem; margin: 0 0 0.5rem 0; color: #0f172a; font-weight: 800; }
    .auth-header p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }

    /* Button Styles */
    .auth-btn {
      width: 100%; padding: 0.9rem; margin-bottom: 0.75rem; border: 1.5px solid var(--border);
      border-radius: var(--radius); background: var(--white); color: var(--text-main); font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer; transition: 0.2s; font-size: 1rem;
    }
    .auth-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

    .divider { display: flex; align-items: center; color: var(--text-muted); font-size: 0.8rem; margin: 1.5rem 0; font-weight: 600; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 10px; }

    .form-control { width: 100%; padding: 1rem; box-sizing: border-box; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 1rem; margin-bottom: 1rem; transition: 0.2s; font-weight: 500; }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

    .btn-submit {
      width: 100%; background: var(--primary); color: white; padding: 1.1rem;
      border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }
    .btn-submit:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    .hidden { display: none; }

    /* Success Screen Overlay (Full Card Overlay) */
    #success-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--white); z-index: 100;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; animation: fadeIn 0.5s ease forwards;
    }
    .success-icon {
      width: 80px; height: 80px; background: #ecfdf5; color: var(--success);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; margin-bottom: 1.5rem; animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .timer-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 1rem; }
    
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="auth-card">
  <div id="success-screen">
    <div class="success-icon">✓</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem;">Access Granted</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 1rem;">Welcome to the elite experience.</p>
    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <div id="auth-content">
    <div class="auth-header">
      <h1 id="auth-title">Log in or sign up</h1>
      <p id="auth-desc">Choose your preferred access method</p>
    </div>

    <div id="choice-step">
      <button class="auth-btn" onclick="loginWithGoogle()">
        <i class="fab fa-google" style="color: #4285F4;"></i> Continue with Google
      </button>
      <button class="auth-btn" onclick="showPhoneInput()">
        <i class="fas fa-mobile-alt"></i> Continue with Phone
      </button>
      
      <div class="divider">OR</div>
      
      <input type="email" id="email" class="form-control" placeholder="Email address">
      <div id="password-wrapper" class="hidden">
        <input type="password" id="password" class="form-control" placeholder="Password">
      </div>
      <button class="btn-submit" id="email-btn" onclick="handleEmailContinue()">Continue</button>
    </div>

    <div id="phone-step" class="hidden">
      <input type="tel" id="phoneNumber" class="form-control" placeholder="+44 7123 456789">
      <div id="recaptcha-container"></div>
      <button class="btn-submit" id="sendBtn" onclick="sendOTP()">Get Access Code</button>
      <button onclick="location.reload()" style="background:none; border:none; margin-top:20px; color:var(--text-muted); cursor:pointer; font-weight:600;">Back to options</button>
    </div>

    <div id="otp-step" class="hidden">
      <input type="number" id="otpCode" class="form-control" placeholder="000000" style="text-align:center; letter-spacing: 8px;">
      <button class="btn-submit" id="verifyBtn" onclick="verifyOTP()">Verify & Enter</button>
      <div class="timer-text" id="timer-container">Resend code in <span id="timer-sec">30</span>s</div>
    </div>

    <div id="name-step" class="hidden">
      <input type="text" id="userName" class="form-control" placeholder="Enter your full name">
      <button class="btn-submit" onclick="saveNameAndFinish()">Complete Registration</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  let confirmationResult;
  let timerInterval;

  window.onload = function() {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
  };

  function showPhoneInput() {
    document.getElementById('choice-step').classList.add('hidden');
    document.getElementById('phone-step').classList.remove('hidden');
    document.getElementById('auth-title').innerText = "Phone Access";
  }

  // --- GOOGLE ---
  async function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const res = await firebase.auth().signInWithPopup(provider);
      checkProfileAndRedirect(res.user);
    } catch (err) { alert(err.message); }
  }

  // --- EMAIL ---
  async function handleEmailContinue() {
    const email = document.getElementById('email').value;
    const passWrapper = document.getElementById('password-wrapper');
    if (passWrapper.classList.contains('hidden')) {
      if(!email) return alert("Enter email address");
      passWrapper.classList.remove('hidden');
      document.getElementById('email-btn').innerText = "Sign In";
    } else {
      try {
        const res = await firebase.auth().signInWithEmailAndPassword(email, document.getElementById('password').value);
        checkProfileAndRedirect(res.user);
      } catch (err) { alert(err.message); }
    }
  }

  // --- PHONE / OTP ---
  async function sendOTP() {
    const phone = document.getElementById('phoneNumber').value;
    if(!phone) return alert("Enter phone number");
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('sendBtn').innerText = "Sending...";

    firebase.auth().signInWithPhoneNumber(phone, window.recaptchaVerifier).then(res => {
      confirmationResult = res;
      document.getElementById('phone-step').classList.add('hidden');
      document.getElementById('otp-step').classList.remove('hidden');
      document.getElementById('auth-title').innerText = "Verify Identity";
      startTimer();
    }).catch(e => { alert(e.message); document.getElementById('sendBtn').disabled = false; });
  }

  async function verifyOTP() {
    const code = document.getElementById('otpCode').value;
    if(code.length !== 6) return alert("Enter 6 digits");
    document.getElementById('verifyBtn').disabled = true;

    confirmationResult.confirm(code)
      .then(res => checkProfileAndRedirect(res.user))
      .catch(() => { alert("Invalid code"); document.getElementById('verifyBtn').disabled = false; });
  }

  function startTimer() {
    let timeLeft = 30;
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer-sec').innerText = timeLeft;
      if(timeLeft <= 0) clearInterval(timerInterval);
    }, 1000);
  }

  // --- REDIRECT & NAME CHECK (All original logic) ---
  async function checkProfileAndRedirect(user) {
    try {
      // 1. Check if Provider (Redirect to provider dashboard)
      const providerSnap = await firebase.firestore().collection('providers').doc(user.uid).get();
      if (providerSnap.exists) return triggerSuccess(true);

      // 2. Check if Customer exists and has a name
      const customerSnap = await firebase.firestore().collection('customers').doc(user.uid).get();
      if (customerSnap.exists && (customerSnap.data().name || user.displayName)) {
        triggerSuccess(false);
      } else {
        // Switch to name registration if name is missing
        document.getElementById('choice-step').classList.add('hidden');
        document.getElementById('otp-step').classList.add('hidden');
        document.getElementById('name-step').classList.remove('hidden');
        document.getElementById('auth-title').innerText = "Welcome!";
      }
    } catch (e) { triggerSuccess(false); }
  }

  async function saveNameAndFinish() {
    const name = document.getElementById('userName').value;
    const user = firebase.auth().currentUser;
    if(!name) return alert("Please enter your name");

    await firebase.firestore().collection('customers').doc(user.uid).set({
      name: name,
      email: user.email || '',
      phone: user.phoneNumber || '',
      createdAt: new Date()
    }, { merge: true });
    triggerSuccess(false);
  }

  function triggerSuccess(isProvider) {
    document.getElementById('auth-content').classList.add('hidden');
    document.getElementById('success-screen').style.display = 'flex';
    setTimeout(() => {
      window.location.replace(isProvider ? 'provider-dashboard.html' : 'index.html');
    }, 2200);
  }
</script>
</body>
</html>
