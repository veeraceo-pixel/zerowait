<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="sq-main">
    <section class="sq-section">
      <div class="sq-container sq-grid-2">
        <div>
          <h1>Log in</h1>
          <p class="sq-subtle">Access your queues and dashboard.</p>
        </div>
        <div class="sq-card">
          <form id="login-form" class="sq-form">
            <label>
              <span>Email</span>
              <input type="email" name="email" required />
            </label>
            <label>
              <span>Password</span>
              <input type="password" name="password" required />
            </label>
            <button type="submit" class="sq-btn sq-btn-primary">Log in</button>
            <p id="login-message" class="sq-form-message"></p>
            <p class="sq-subtle">
              No account? <a href="/signup.html">Sign up</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { login } from './api.js';

    const form = document.getElementById('login-form');
    const msg = document.getElementById('login-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'sq-form-message';

      const data = Object.fromEntries(new FormData(form).entries());
      msg.textContent = 'Logging in…';

      const result = await login(data.email, data.password);
      if (result.error) {
        msg.textContent = result.error;
        msg.classList.add('error');
      } else {
        msg.textContent = 'Logged in. Redirecting…';
        msg.classList.add('success');
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      }
    });
  </script>
</body>
</html>
