<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Nearby Services | skipQs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --bg-light: #f8fafc; --text-main: #1e293b;
            --text-muted: #64748b; --border: #e2e8f0; --nav-bg: #2d1b4d;
            --success: #059669;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); margin: 0; height: 100vh; overflow: hidden; }
        .navbar { background: var(--nav-bg); padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; position: relative; }
        .logo { font-weight: 800; color: white; text-decoration: none; font-size: 1.2rem; }

        .service-filter-bar {
            display: flex; gap: 8px; overflow-x: auto; padding: 10px 1.25rem;
            background: white; border-bottom: 1px solid var(--border);
            scrollbar-width: none; align-items: center;
        }
        .service-filter-bar::-webkit-scrollbar { display: none; }
        
        .filter-chip {
            white-space: nowrap; padding: 6px 16px; border-radius: 50px;
            background: var(--bg-light); border: 1px solid var(--border);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-muted);
        }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .live-toggle { background: #ecfdf5; color: var(--success); border: 1px solid #34d399; }
        .live-toggle.active { background: var(--success); color: white; }

        .main-layout { display: flex; height: calc(100vh - 110px); flex-direction: column; }
        .list-panel { flex: 1; overflow-y: auto; padding: 1.25rem; background: white; z-index: 10; width: 100%; }
        
        .visual-panel { display: none; background: #f1f5f9; position: relative; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .placeholder-box { max-width: 400px; color: var(--text-muted); }
        .placeholder-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }

        .place-card { padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 12px; background: white; cursor: pointer; transition: 0.2s; position: relative; }
        .place-card.hidden { display: none; }
        .place-card.active { border: 2.5px solid var(--primary); background: #f0f7ff; }

        .card-top { display: flex; gap: 12px; margin-bottom: 12px; }
        .thumb { width: 75px; height: 75px; border-radius: 8px; object-fit: cover; background: #eee; }
        .info-tags { display: flex; gap: 8px; margin-top: 5px; align-items: center; }
        .dist-tag { font-size: 0.65rem; color: var(--primary); font-weight: 800; background: #eff6ff; padding: 2px 6px; border-radius: 4px; }
        .time-tag { font-size: 0.65rem; color: var(--success); font-weight: 700; }

        .action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 80px; padding: 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; text-align: center; cursor: pointer; border: none; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-join { background: var(--primary); color: white; }
        .btn-reg { background: #475569; color: white; line-height: 1.2; font-size: 0.6rem; }
        .btn-sec { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
        
        .btn-whatsapp { background: #25D366 !important; color: white !important; gap: 5px; }
        .btn-whatsapp img { width: 14px; height: 14px; filter: brightness(0) invert(1); }

        .q-badge { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 4px; margin-top: 5px; display: inline-block; }
        .q-online { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .q-offline { background: #f1f5f9; color: #64748b; }
        
        .est-box { font-size: 0.65rem; color: var(--success); margin-top: 4px; line-height: 1.4; }

        @media (min-width: 769px) { 
            .main-layout { flex-direction: row; } 
            .list-panel { max-width: 450px; border-right: 1px solid var(--border); } 
            .visual-panel { display: flex; flex: 1; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">skipQs</a>
        <div>
            <a href="dashboard.html" style="color:white; text-decoration:none; font-size:0.85rem; margin-right:15px;">My Visits</a>
            <a href="login.html" id="authBtn" style="color:white; text-decoration:none; font-size:0.85rem; font-weight:600; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:6px;">Login</a>
        </div>
    </nav>

    <div class="service-filter-bar" id="filterBar">
        <div class="filter-chip live-toggle" id="toggleLive" onclick="toggleLiveOnly()">⚡ Live Only</div>
        <div style="border-left: 1px solid #eee; height: 20px; margin: 0 5px;"></div>
        <div class="filter-chip" data-type="salon">💇‍♀️ Salons</div>
        <div class="filter-chip" data-type="dining">🍽️ Dining</div>
        <div class="filter-chip" data-type="clinic">🏥 Clinics</div>
        <div class="filter-chip" data-type="banking">🏦 Banking</div>
        <div class="filter-chip" data-type="gym">🏋️ Gyms</div>
        <div class="filter-chip" data-type="repair">🛠️ Repairs</div>
        <div class="filter-chip" data-type="gov">🏛️ Gov</div>
        <div class="filter-chip" data-type="wash">🧼 Wash</div>
    </div>

    <div class="main-layout">
        <div class="list-panel">
            <h2 id="title" style="margin:0; font-size:1.2rem;">Nearby Services</h2>
            <p id="counter" style="font-size:0.7rem; color:var(--text-muted); margin-bottom:1rem;">Locating area...</p>
            <div id="results"></div>
        </div>

        <div class="visual-panel" id="detailPanel">
            <div class="placeholder-box">
                <span class="placeholder-icon">📍</span>
                <h3>Select a service to see details</h3>
                <p>Find the shortest queues and join live lines instantly.</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const db = firebase.firestore();
        const params = new URLSearchParams(window.location.search);
        
        let serviceType = params.get("type") || 'salon';
        let liveOnly = false;
        let activeListeners = [];
        let userLocation;
        let currentPlaces = []; 
        let Place = null;

        // FIXED: Using primary types to avoid Google API 500 errors
        const SERVICE_MAP = {
            salon: { type: "beauty_salon", label: "Salons & Barbers" },
            dining: { type: "restaurant", label: "Restaurants & Dining" },
            clinic: { type: "medical_clinic", label: "Clinics & Health" },
            banking: { type: "bank", label: "Banking & Finance" },
            gym: { type: "gym", label: "Gyms & Fitness" },
            repair: { type: "car_repair", label: "Repairs & Services" },
            gov: { type: "local_government_office", label: "Gov & Public Services" },
            wash: { type: "car_wash", label: "Wash & Laundry" }
        };

        document.getElementById("title").innerText = SERVICE_MAP[serviceType].label;

        // Filter Chip Logic
        document.querySelectorAll('.filter-chip[data-type]').forEach(chip => {
            if(chip.dataset.type === serviceType) chip.classList.add('active');
            chip.onclick = () => {
                document.querySelectorAll('.filter-chip[data-type]').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                serviceType = chip.dataset.type;
                document.getElementById("title").innerText = SERVICE_MAP[serviceType].label;
                executePlacesSearch();
            };
        });

        function toggleLiveOnly() {
            liveOnly = !liveOnly;
            document.getElementById('toggleLive').classList.toggle('active', liveOnly);
            applyLiveFilter();
        }

        function applyLiveFilter() {
            const cards = document.querySelectorAll('.place-card');
            let visibleCount = 0;
            cards.forEach(card => {
                const isLive = card.getAttribute('data-live') === 'true';
                if (liveOnly && !isLive) card.classList.add('hidden');
                else { card.classList.remove('hidden'); visibleCount++; }
            });
            document.getElementById("counter").innerText = `Showing ${visibleCount} results.`;
        }

        async function initMap() {
            try {
                const { Place: PlaceLib } = await google.maps.importLibrary("places");
                Place = PlaceLib;

                const geoOptions = {
                    enableHighAccuracy: false,
                    timeout: 8000, 
                    maximumAge: 60000
                };

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLocation = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                        executePlacesSearch();
                    },
                    (err) => {
                        console.warn("Location error. Using Manchester fallback.");
                        userLocation = new google.maps.LatLng(53.4808, -2.2426); 
                        executePlacesSearch();
                    },
                    geoOptions
                );
            } catch (e) {
                console.error("Maps Library failed:", e);
            }
        }

async function executePlacesSearch() {
    if (!userLocation) return;
    
    const resultsContainer = document.getElementById("results");
    resultsContainer.innerHTML = "<p style='padding:20px;'>Fetching local businesses...</p>";
    
    // 1. Clear previous listeners
    activeListeners.forEach(unsub => unsub());
    activeListeners = [];
    
    try {
        // 2. Map the UI serviceType to your Firebase Category Label
        // This ensures 'salon' matches 'Barber' in your DB
        const categoryToLookup = SERVICE_MAP[serviceType].label.split(' ')[0].replace('s', ''); 
        
        // 3. Fetch from Firebase (Dr James Aesthetics etc.)
        // We use a case-insensitive check or a direct match depending on how you save it
        const snapshot = await db.collection('providers')
                                 .where('category', '==', categoryToLookup) 
                                 .get();

        let firebasePlaces = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            firebasePlaces.push({
                id: doc.id,
                displayName: data.businessName,
                location: new google.maps.LatLng(data.lat, data.lng),
                shortFormattedAddress: data.address || "Registered skipQs Partner",
                isRegistered: true,
                liveData: { ...data, id: doc.id },
                photos: data.imageUrl ? [{ getURI: () => data.imageUrl }] : null
            });
        });

        // 4. Fetch Google Maps places as backup
        let googlePlaces = [];
        if (Place) {
            const config = SERVICE_MAP[serviceType];
            const request = {
                fields: ["displayName", "location", "id", "photos", "shortFormattedAddress"],
                locationRestriction: {
                    center: { lat: userLocation.lat(), lng: userLocation.lng() },
                    radius: 5000 
                },
                includedPrimaryTypes: [config.type],
                maxResultCount: 10
            };
            const { places } = await Place.searchNearby(request);
            googlePlaces = places || [];
        }

        // 5. Merge and prioritize Firebase
        // We filter out any Google results that might already be in our Firebase
        const registeredLinks = firebasePlaces.map(p => p.liveData.googleMapsLink);
        const uniqueGooglePlaces = googlePlaces.filter(p => {
            // Check if this Google place's ID or name is already in our Firebase list
            return !firebasePlaces.some(fp => fp.displayName === p.displayName);
        });

        currentPlaces = [...firebasePlaces, ...uniqueGooglePlaces];

        if (currentPlaces.length > 0) {
            renderList(currentPlaces);
        } else {
            resultsContainer.innerHTML = "<p style='padding:20px;'>No services found in this area.</p>";
        }

    } catch (error) {
        console.error("Search Error:", error);
        resultsContainer.innerHTML = "<p style='padding:20px;'>Error loading services. Please try again.</p>";
    }
}

        function renderList(places) {
            const container = document.getElementById("results");
            container.innerHTML = "";
            
            places.forEach(p => {
                p.calculatedDistance = google.maps.geometry.spherical.computeDistanceBetween(userLocation, p.location);
            });
            places.sort((a, b) => a.calculatedDistance - b.calculatedDistance);

            places.forEach((place, i) => {
                const miles = (place.calculatedDistance * 0.000621371).toFixed(1);
                const driveTime = Math.round((miles / 12) * 60) + 2; 
                
                let thumb = 'https://via.placeholder.com/150';
                if (place.photos && place.photos.length > 0) {
                    thumb = place.photos[0].getURI({maxWidth: 200, maxHeight: 200});
                }

                const card = document.createElement('div');
                card.className = 'place-card';
                card.id = `card-${i}`;
                card.setAttribute('data-live', 'false');
                
                // FIXED: Template string syntax ${variable}
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.displayName)}&query_place_id=${place.id}`;

                card.innerHTML = `
                    <div onclick="selectPlace(${i})">
                        <div class="card-top">
                            <img src="${thumb}" class="thumb">
                            <div style="flex:1">
                                <strong style="font-size:0.95rem;">${place.displayName}</strong>
                                <div class="info-tags">
                                    <span class="dist-tag">${miles} mi</span>
                                    <span class="time-tag">🚗 ${driveTime} min drive</span>
                                </div>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${place.shortFormattedAddress || "Address nearby"}</span>
                                <div id="status-${i}" class="q-badge q-offline">No Live Queue</div>
                                <div id="est-${i}" class="est-box"></div>
                            </div>
                        </div>
                    </div>
                    <div class="action-row" id="actions-${i}">
                         <a href="${mapsUrl}" target="_blank" class="btn btn-sec">Directions</a>
                         <button onclick="window.location.href='provider-signup.html'" class="btn btn-reg">BUSINESS OWNER?<br>REGISTER FREE</button>
                    </div>
                `;
                container.appendChild(card);

                const unsub = db.collection('providers').where('googlePlaceId', '==', place.id).onSnapshot(snap => {
                    if (!snap.empty) {
                        const d = snap.docs[0].data();
                        const providerId = snap.docs[0].id;
                        place.liveData = { ...d, id: providerId }; 
                        card.setAttribute('data-live', 'true');
                        
                        const statusDiv = document.getElementById(`status-${i}`);
                        const estDiv = document.getElementById(`est-${i}`);
                        const actionDiv = document.getElementById(`actions-${i}`);

                        if(statusDiv) {
                            statusDiv.className = "q-badge q-online";
                            statusDiv.innerText = `LIVE: ${d.peopleInLine || 0} in line`;
                        }
                        
                        if (estDiv && d.currentWaitMins > 0) {
                            const timeStr = new Date(Date.now() + d.currentWaitMins * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            estDiv.innerHTML = `⌛ Wait: <b>~${d.currentWaitMins}m</b> • Service at <b>${timeStr}</b>`;
                        }

                        if(actionDiv) {
                            let whatsappHtml = d.phone ? `<a href="https://wa.me/${d.phone.toString().replace(/\D/g, '')}" target="_blank" class="btn btn-whatsapp"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:14px;"> Chat</a>` : "";
                            actionDiv.innerHTML = `
                                <a href="${mapsUrl}" target="_blank" class="btn btn-sec">Directions</a>
                                ${whatsappHtml}
                                <button onclick="window.location.href='join-queue.html?id=${providerId}'" class="btn btn-join">JOIN QUEUE</button>
                            `;
                        }
                    }
                });
                activeListeners.push(unsub);
            });
            document.getElementById("counter").innerText = `Found ${places.length} results nearby.`;
        }

        function selectPlace(index) {
            const place = currentPlaces[index];
            document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${index}`).classList.add('active');

            const panel = document.getElementById('detailPanel');
            let mainPhoto = place.photos && place.photos.length > 0 ? place.photos[0].getURI({maxWidth: 800}) : 'https://via.placeholder.com/600x400';
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.displayName)}&query_place_id=${place.id}`;

            let liveSection = `<div class="q-badge q-offline" style="margin-bottom:15px; font-size:1rem; padding:10px;">Queueing not enabled</div>`;
            if (place.liveData) {
                liveSection = `
                    <div class="q-badge q-online" style="font-size:1.1rem; padding:15px 25px; margin-bottom:15px;">
                        ${place.liveData.peopleInLine || 0} People Waiting
                    </div>
                    <button onclick="window.location.href='join-queue.html?id=${place.liveData.id}'" class="btn btn-join" style="font-size:1rem; padding:15px; width:100%;">JOIN LIVE QUEUE</button>
                `;
            }

            panel.innerHTML = `
                <div style="width:100%; max-width:480px; background:white; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1); text-align:left;">
                    <img src="${mainPhoto}" style="width:100%; height:280px; object-fit:cover;">
                    <div style="padding:25px;">
                        <h2 style="margin:0 0 5px 0; font-size:1.5rem;">${place.displayName}</h2>
                        <p style="color:var(--text-muted); margin-bottom:20px; font-size:0.9rem;">${place.shortFormattedAddress}</p>
                        ${liveSection}
                        <a href="${mapsUrl}" target="_blank" class="btn btn-sec" style="margin-top:15px; width:100%;">Get Directions</a>
                    </div>
                </div>
            `;
        }
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAJFGE5OFfn-OhDNJ_rWO5oi2d2CHl2fXE&loading=async&libraries=places,geometry&callback=initMap"></script>
</body>
</html>
