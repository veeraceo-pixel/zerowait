<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Nearby Services | skipQs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rm-navy: #000333; --rm-teal: #00adbb; --rm-bg: #f3f3f3;
            --primary: #2563eb; --border: #dfdfdf; --success: #059669;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--rm-bg); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .navbar { background: white; padding: 0.5rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .logo { font-weight: 800; color: var(--primary); text-decoration: none; font-size: 1.4rem; }

        .filter-strip { background: var(--rm-navy); padding: 12px 1.5rem; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        .search-input { width: 100%; padding: 12px 15px; border-radius: 4px; border: none; font-size: 1rem; outline: none; box-sizing: border-box; }
        
        .service-filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 1.5rem; background: white; border-bottom: 1px solid var(--border); scrollbar-width: none; flex-shrink: 0; align-items: center; }
        .service-filter-bar::-webkit-scrollbar { display: none; }
        
        .dist-select { padding: 8px 12px; border-radius: 50px; border: 1px solid var(--border); background: #f8fafc; font-weight: 600; color: #64748b; font-size: 0.85rem; outline: none; cursor: pointer; }

        .filter-chip { white-space: nowrap; padding: 8px 18px; border-radius: 50px; background: #f1f5f9; border: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #64748b; transition: 0.2s; }
        .filter-chip.active { background: var(--rm-teal); color: white; border-color: var(--rm-teal); }
        .live-toggle { background: #ecfdf5; color: var(--success); border: 1px solid #34d399; }
        .live-toggle.active { background: var(--success); color: white; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .list-panel { flex: 1; overflow-y: auto; padding: 1.5rem; max-width: 500px; background: white; }
        .visual-panel { flex: 1.5; position: relative; border-left: 1px solid var(--border); background: #eee; }
        #map { width: 100%; height: 100%; }

        .place-card { background: white; margin-bottom: 1.5rem; border-radius: 4px; overflow: hidden; border-bottom: 4px solid var(--rm-teal); box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; cursor: pointer; }
        .card-body { display: flex; flex-direction: row; }
        .card-img-container { width: 40%; height: 180px; position: relative; background: #f0f0f0; flex-shrink: 0; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .place-name { font-size: 1.1rem; font-weight: 700; color: var(--rm-navy); margin: 0; }
        .address-text { color: #666; font-size: 0.85rem; line-height: 1.4; }
        .dist-tag { font-size: 0.75rem; color: var(--rm-teal); font-weight: 800; }
        .est-box { font-size: 0.75rem; color: var(--success); font-weight: 600; margin-top: 5px; }
        
        .q-badge { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .q-online { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .q-offline { background: #f1f5f9; color: #64748b; }

        .card-footer { display: flex; background: #fafafa; border-top: 1px solid #eee; }
        .footer-btn { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-weight: 700; font-size: 0.8rem; border-right: 1px solid #eee; text-align: center; text-decoration: none; color: var(--rm-navy); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-join-main { background: var(--rm-navy) !important; color: white !important; }

        #details-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display:none; flex-direction: column; z-index: 1000; }
        #photo-strip { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; align-items: center; scrollbar-width: none; }
        #photo-strip img { max-height: 85vh; min-width: 100%; object-fit: contain; scroll-snap-align: start; }
        .close-btn { position:absolute; top:20px; right:20px; z-index:1100; background: white; border:none; border-radius:50%; width:44px; height:44px; cursor:pointer; font-weight: bold; }

        #redo-search { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; background: white; border: none; padding: 12px 24px; border-radius: 50px; font-weight: 700; display: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #gps-btn { position: absolute; bottom: 30px; right: 20px; z-index: 100; background: white; border: none; width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; font-size: 1.5rem; }

        @media (max-width: 768px) {
            .visual-panel { display: none !important; }
            .list-panel { max-width: 100%; flex: 1; width: 100%; }
            .card-body { flex-direction: column; }
            .card-img-container { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">skipQs</a>
        <div>
            <a href="dashboard.html" style="text-decoration:none; color: #444; margin-right:20px; font-size:0.9rem;">My Visits</a>
            <a href="login.html" style="text-decoration:none; color: white; background: var(--primary); padding: 8px 16px; border-radius: 4px; font-weight:700;">Login</a>
        </div>
    </nav>

    <div class="filter-strip">
        <input type="text" id="locInput" class="search-input" placeholder="Search by area or zip...">
    </div>

    <div class="service-filter-bar">
        <select id="distFilter" class="dist-select" onchange="executePlacesSearch()">
            <option value="1">1 Mile</option>
            <option value="5" selected>5 Miles</option>
            <option value="10">10 Miles</option>
            <option value="25">25 Miles</option>
        </select>
        <div class="filter-chip live-toggle" id="toggleLive" onclick="toggleLiveOnly()">⚡ Live Only</div>
        <div class="filter-chip active" data-type="salon">💇‍♀️ Salons</div>
        <div class="filter-chip" data-type="dining">🍽️ Dining</div>
        <div class="filter-chip" data-type="clinic">🏥 Clinics</div>
        <div class="filter-chip" data-type="banking">🏦 Banking</div>
    </div>

    <div class="main-layout">
        <div class="list-panel">
            <h2 id="list-title" style="margin:0; font-size:1.2rem; color: var(--rm-navy);">Nearby Services</h2>
            <p id="counter" style="font-size:0.85rem; color:#666; margin-bottom:1.5rem;">Ready to search...</p>
            <div id="results"></div>
        </div>

        <div class="visual-panel">
            <button id="redo-search" onclick="redoSearch()">🔄 Search this area</button>
            <button id="gps-btn" onclick="forceGPS()">🎯</button>
            <div id="map"></div>
            <div id="details-overlay">
                <button class="close-btn" onclick="closeDetails()">✕</button>
                <div id="photo-strip"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const db = firebase.firestore();
        let serviceType = 'salon';
        let liveOnly = false;
        let map, placesService, userLocation, markers = [];

        const SERVICE_MAP = {
            salon: { keyword: "salon barber hair beauty", label: "Salons", avgTime: 20 },
            dining: { keyword: "restaurant cafe food", label: "Dining", avgTime: 15 },
            clinic: { keyword: "clinic doctor health", label: "Clinics", avgTime: 25 },
            banking: { keyword: "bank finance atm", label: "Banking", avgTime: 10 }
        };

        function initMap() {
            navigator.geolocation.getCurrentPosition(
                (pos) => { 
                    userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; 
                    setupMap(); 
                },
                () => { 
                    userLocation = { lat: 17.4065, lng: 78.4772 }; 
                    setupMap(); 
                },
                { enableHighAccuracy: true }
            );

            document.getElementById('locInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') geocodeSearch(e.target.value);
            });
        }

        function setupMap() {
            const mapEl = document.getElementById("map");
            if(!mapEl) return;
            map = new google.maps.Map(mapEl, {
                center: userLocation, zoom: 14, disableDefaultUI: true,
                styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }]
            });
            placesService = new google.maps.places.PlacesService(map);
            map.addListener('dragend', () => document.getElementById('redo-search').style.display = 'block');
            executePlacesSearch();
        }

        function forceGPS() {
            navigator.geolocation.getCurrentPosition((pos) => {
                userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                map.setCenter(userLocation);
                executePlacesSearch();
            });
        }

        function redoSearch() {
            document.getElementById('redo-search').style.display = 'none';
            userLocation = map.getCenter();
            executePlacesSearch();
        }

        function toggleLiveOnly() {
            liveOnly = !liveOnly;
            document.getElementById('toggleLive').classList.toggle('active', liveOnly);
            executePlacesSearch();
        }

        function geocodeSearch(query) {
            new google.maps.Geocoder().geocode({ address: query }, (results, status) => {
                if (status === "OK") {
                    userLocation = results[0].geometry.location;
                    if(map) map.setCenter(userLocation);
                    executePlacesSearch();
                }
            });
        }

        function executePlacesSearch() {
            if(!placesService || !userLocation) return;
            
            markers.forEach(m => m.setMap(null));
            markers = [];
            
            // CONVERT MILES TO METERS (1 Mile = 1609.34 Meters)
            const miles = document.getElementById('distFilter').value;
            const radiusInMeters = miles * 1609.34;
            const config = SERVICE_MAP[serviceType];

            const request = {
                location: userLocation,
                radius: radiusInMeters,
                keyword: config.keyword
            };

            placesService.nearbySearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    renderList(results);
                } else {
                    document.getElementById("results").innerHTML = "<p style='text-align:center; padding:20px;'>No results found in this area. Try increasing the search radius.</p>";
                    document.getElementById("counter").innerText = "0 results found.";
                }
            });
        }

        function renderList(results) {
            const container = document.getElementById("results");
            container.innerHTML = "";
            const currentConfig = SERVICE_MAP[serviceType];

            results.forEach((place, i) => {
                // CONVERT METERS TO MILES (dist / 1609.34)
                const distMeters = google.maps.geometry.spherical.computeDistanceBetween(
                    new google.maps.LatLng(userLocation.lat, (userLocation.lng.get ? userLocation.lng() : userLocation.lng)), 
                    place.geometry.location
                );
                const distMiles = (distMeters / 1609.34).toFixed(1);
                
                const thumb = place.photos ? place.photos[0].getUrl({maxWidth: 400}) : 'https://via.placeholder.com/400x250';
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${place.name}&destination_place_id=${place.place_id}`;
                
                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
                    <div class="card-body" onclick="selectPlace('${place.place_id}')">
                        <div class="card-img-container"><img src="${thumb}" class="card-img"></div>
                        <div class="card-info">
                            <h3 class="place-name">${place.name}</h3>
                            <div class="address-text">${place.vicinity}</div>
                            <div class="dist-tag">📍 ${distMiles} miles away</div>
                            <div id="status-${i}" class="q-badge q-offline">Off-platform</div>
                            <div id="est-${i}" class="est-box"></div>
                        </div>
                    </div>
                    <div class="card-footer" id="actions-${i}">
                        <a href="${mapsUrl}" target="_blank" class="footer-btn">Directions</a>
                        <a href="provider-signup.html" class="footer-btn">Claim Business</a>
                    </div>
                `;
                container.appendChild(card);

                db.collection('providers').where('googlePlaceId', '==', place.place_id).get().then(snap => {
                    if (!snap.empty) {
                        const d = snap.docs[0].data();
                        const count = d.queueCount || 0;
                        const waitMins = count * currentConfig.avgTime;
                        const serviceTime = new Date(new Date().getTime() + waitMins * 60000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

                        document.getElementById(`status-${i}`).className = "q-badge q-online";
                        document.getElementById(`status-${i}`).innerText = `LIVE: ${count} in line`;
                        document.getElementById(`est-${i}`).innerText = `⌛ ~${waitMins}m wait • at ${serviceTime}`;

                        let whatsappHtml = d.phone ? `<a href="https://wa.me/${d.phone.toString().replace(/\D/g, '')}" target="_blank" class="footer-btn">Chat</a>` : "";
                        document.getElementById(`actions-${i}`).innerHTML = `
                            <a href="${mapsUrl}" target="_blank" class="footer-btn">Directions</a>
                            ${whatsappHtml}
                            <a href="join-queue.html?id=${snap.docs[0].id}" class="footer-btn btn-join-main">JOIN QUEUE</a>
                        `;
                    } else if (liveOnly) {
                        card.style.display = 'none';
                    }
                });
            });
            document.getElementById("counter").innerText = `Found ${results.length} results.`;
        }

        function selectPlace(pid) {
            const overlay = document.getElementById('details-overlay');
            const strip = document.getElementById('photo-strip');
            overlay.style.display = 'flex';
            placesService.getDetails({ placeId: pid, fields: ['photos'] }, (details) => {
                if (details && details.photos) {
                    strip.innerHTML = details.photos.map(p => `<img src="${p.getUrl({maxWidth: 1200})}">`).join('');
                }
            });
        }

        function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }

        document.querySelectorAll('.filter-chip[data-type]').forEach(chip => {
            chip.onclick = () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                serviceType = chip.dataset.type;
                executePlacesSearch();
            };
        });
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY&libraries=places,geometry&callback=initMap" async defer></script>
</body>
</html>
