<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Nearby Services | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --primary:#002f34;--accent:#23e5db;--accent2:#ffce32;
      --bg:#f7f8f8;--text-muted:#64748b;--border:#e2e8f0;
      --success:#059669;--card-bg:#fff;--radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

    /* ── Navbar ── */
    .navbar{
      background:var(--primary);padding:.85rem 1.5rem;
      display:flex;justify-content:space-between;align-items:center;
      flex-shrink:0;position:relative;z-index:500;
      box-shadow:0 2px 12px rgba(0,0,0,.25);
    }
    .logo{font-weight:800;color:var(--accent);text-decoration:none;font-size:1.25rem;letter-spacing:-.5px;}
    .logo span{color:var(--accent2);}
    .nav-links{display:flex;gap:6px;align-items:center;}
    .nav-links a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:8px;transition:.2s;}
    .nav-links a:hover{color:#fff;background:rgba(255,255,255,.1);}
    .nav-links a.pill{background:var(--accent);color:var(--primary);padding:7px 16px;border-radius:50px;}
    .nav-links a.pill:hover{opacity:.9;background:var(--accent);}

    /* ── Filter bar ── */
    .filter-bar{
      display:flex;gap:8px;overflow-x:auto;padding:10px 1rem;
      background:#fff;border-bottom:1px solid var(--border);
      scrollbar-width:none;align-items:center;flex-shrink:0;
    }
    .filter-bar::-webkit-scrollbar{display:none;}
    .chip{
      white-space:nowrap;padding:7px 16px;border-radius:50px;
      background:var(--bg);border:1.5px solid var(--border);
      font-size:.78rem;font-weight:700;cursor:pointer;color:var(--text-muted);
      transition:.15s;user-select:none;
    }
    .chip:hover{border-color:var(--primary);color:var(--primary);}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
    .chip-live{background:#ecfdf5;color:var(--success);border-color:#6ee7b7;}
    .chip-live.active{background:var(--success);color:#fff;border-color:var(--success);}
    .divider{width:1px;height:22px;background:var(--border);flex-shrink:0;}

    /* ── Mobile toggle ── */
    .mobile-toggle{
      display:none;background:#fff;border-bottom:1px solid var(--border);
      padding:8px 1rem;gap:6px;flex-shrink:0;
    }
    .toggle-btn{
      flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);
      font-size:.8rem;font-weight:700;cursor:pointer;background:var(--bg);color:var(--text-muted);
      transition:.15s;
    }
    .toggle-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
    @media(max-width:768px){.mobile-toggle{display:flex;}}

    /* ── Main layout ── */
    .main-layout{display:flex;flex:1;overflow:hidden;min-height:0;}

    /* ── List panel ── */
    .list-panel{
      width:420px;flex-shrink:0;overflow-y:auto;background:#fff;
      border-right:1px solid var(--border);display:flex;flex-direction:column;
    }
    .list-header{padding:1rem 1.25rem .5rem;border-bottom:1px solid var(--border);}
    .list-header h2{font-size:1.05rem;font-weight:800;color:var(--primary);}
    .list-header p{font-size:.75rem;color:var(--text-muted);margin-top:2px;}
    .results-wrap{padding:.75rem;flex:1;}

    /* ── Map panel ── */
    .map-panel{flex:1;position:relative;overflow:hidden;}
    #leaflet-map{width:100%;height:100%;}

    /* ── Cards ── */
    .place-card{
      border:1.5px solid var(--border);border-radius:var(--radius);
      background:var(--card-bg);margin-bottom:.75rem;overflow:hidden;
      transition:.2s;cursor:pointer;
    }
    .place-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.08);}
    .place-card.active{border-color:var(--primary);box-shadow:0 4px 20px rgba(0,47,52,.15);}
    .place-card.hidden{display:none;}

    .card-body{padding:.9rem;}
    .card-row{display:flex;gap:12px;align-items:flex-start;}
    .card-icon{
      width:56px;height:56px;border-radius:10px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:1.6rem;
      background:linear-gradient(135deg,var(--primary),#004d57);
    }
    .card-icon.unregistered{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);}
    .card-main{flex:1;min-width:0;}
    .card-name{
      font-size:.95rem;font-weight:800;color:var(--primary);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .card-name.unregistered{color:#334155;}
    .card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px;}
    .meta-pill{
      font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:50px;
    }
    .pill-dist{background:#f0fdfc;color:var(--primary);}
    .pill-drive{background:#f8fafc;color:var(--text-muted);}

    /* Wait time badge */
    .wait-badge{
      margin-top:8px;padding:7px 10px;border-radius:8px;
      display:flex;align-items:center;gap:8px;
    }
    .wait-badge.live{background:#f0fdf4;border:1px solid #bbf7d0;}
    .wait-badge.offline{background:#f8fafc;border:1px solid var(--border);}
    .wait-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .wait-dot.live{background:var(--success);animation:pulse 1.5s infinite;}
    .wait-dot.offline{background:#94a3b8;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .wait-text{font-size:.78rem;font-weight:700;}
    .wait-text.live{color:#065f46;}
    .wait-text.offline{color:var(--text-muted);}
    .wait-sub{font-size:.68rem;color:var(--text-muted);font-weight:500;margin-left:auto;}

    /* Action row */
    .card-actions{
      display:flex;gap:6px;padding:.6rem .9rem .9rem;
      border-top:1px solid var(--border);background:#fafafa;
    }
    .btn{
      flex:1;padding:9px;border-radius:8px;font-size:.75rem;font-weight:700;
      text-align:center;cursor:pointer;border:none;text-decoration:none;
      display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s;
    }
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-primary:hover{opacity:.9;}
    .btn-secondary{background:var(--bg);color:#334155;border:1.5px solid var(--border);}
    .btn-secondary:hover{border-color:var(--primary);color:var(--primary);}
    .btn-register{background:#f0fdfc;color:var(--primary);border:1.5px solid var(--accent);font-size:.68rem;line-height:1.3;}
    .btn-register:hover{background:var(--accent);color:var(--primary);}

    /* ── Empty state ── */
    .empty-state{
      text-align:center;padding:50px 20px;color:var(--text-muted);
    }
    .empty-state .icon{font-size:3rem;margin-bottom:12px;}
    .empty-state h3{font-size:1rem;font-weight:700;color:var(--primary);margin-bottom:6px;}
    .empty-state p{font-size:.82rem;line-height:1.5;}

    /* ── Loading skeleton ── */
    .skeleton{
      background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
      background-size:200% 100%;animation:shimmer 1.4s infinite;
      border-radius:8px;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ── Map popup tweaks ── */
    .leaflet-popup-content-wrapper{border-radius:12px !important;box-shadow:0 8px 24px rgba(0,0,0,.15) !important;}
    .leaflet-popup-content{margin:14px 16px !important;}

    /* ── Responsive ── */
    @media(max-width:768px){
      .list-panel{width:100%;border-right:none;}
      .map-panel{display:none;position:absolute;inset:0;z-index:10;}
      .map-panel.show{display:block;}
      .list-panel.hide{display:none;}
      body{overflow:hidden;}
    }
    @media(min-width:769px){
      .map-panel{display:block !important;}
      .list-panel{display:flex !important;}
    }
  </style>
</head>

          <div style="display:flex;gap:12px;"><div class="skeleton" style="width:56px;height:56px;border-radius:10px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;"><div class="skeleton" style="height:14px;width:70%;border-radius:4px;"></div><div class="skeleton" style="height:10px;width:45%;border-radius:4px;"></div><div class="skeleton" style="height:30px;width:90%;border-radius:8px;"></div></div></div>
        </div>
        <div style="border:1.5px solid #e2e8f0;border-radius:14px;padding:.9rem;">
          <div style="display:flex;gap:12px;"><div class="skeleton" style="width:56px;height:56px;border-radius:10px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;"><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div><div class="skeleton" style="height:10px;width:40%;border-radius:4px;"></div><div class="skeleton" style="height:30px;width:90%;border-radius:8px;"></div></div></div>
        </div>
        <div style="border:1.5px solid #e2e8f0;border-radius:14px;padding:.9rem;">
          <div style="display:flex;gap:12px;"><div class="skeleton" style="width:56px;height:56px;border-radius:10px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;"><div class="skeleton" style="height:14px;width:75%;border-radius:4px;"></div><div class="skeleton" style="height:10px;width:50%;border-radius:4px;"></div><div class="skeleton" style="height:30px;width:90%;border-radius:8px;"></div></div></div>
        </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>

<script>
/* ─── Category config ─── */
const LABELS = {
  salon:'Salons & Barbers', dining:'Restaurants & Dining', clinic:'Clinics & Health',
  banking:'Banking & Finance', gym:'Gyms & Fitness', repair:'Repairs & Services',
  gov:'Gov & Public Services', wash:'Wash & Laundry',
  kirana:'Kirana Stores', bakery:'Bakeries', sweet:'Sweet Shops',
  localshop:'Local Shops', auto:'Auto Stands'
};
const ICONS = {
  salon:'💇', dining:'🍽️', clinic:'🏥', banking:'🏦',
  gym:'🏋️', repair:'🛠️', gov:'🏛️', wash:'🧼',
  kirana:'🛒', bakery:'🍞', sweet:'🍬', localshop:'🏪', auto:'🛺'
};
const CATEGORY_MAP = {
  salon:     ['salon','barber','beauty'],
  clinic:    ['clinic','hospital','medical','doctor'],
  dining:    ['restaurant','cafe','food','dining'],
  banking:   ['bank'],
  gym:       ['gym','fitness'],
  repair:    ['repair','mechanic'],
  gov:       ['government','council'],
  wash:      ['wash','laundry'],
  kirana:    ['kirana','kirana store','grocery','general store','convenience'],
  bakery:    ['bakery','baker','bread'],
  sweet:     ['sweet shop','sweet','mithai','confectionery','sweets'],
  localshop: ['local shop','local','general','shop'],
  auto:      ['auto stand','auto','rickshaw','e-rickshaw','cab']
};
const OVERPASS_TAGS = {
  salon:     [['amenity','hairdresser'],['shop','beauty'],['shop','hairdresser']],
  dining:    [['amenity','restaurant'],['amenity','cafe'],['amenity','fast_food']],
  clinic:    [['amenity','clinic'],['amenity','doctors'],['amenity','hospital']],
  banking:   [['amenity','bank']],
  gym:       [['leisure','fitness_centre'],['amenity','gym']],
  repair:    [['shop','car_repair'],['amenity','car_repair']],
  gov:       [['office','government'],['amenity','townhall'],['office','council']],
  wash:      [['amenity','car_wash'],['shop','laundry'],['shop','dry_cleaning']],
  kirana:    [['shop','convenience'],['shop','general'],['shop','grocery'],['shop','supermarket']],
  bakery:    [['shop','bakery'],['craft','bakery']],
  sweet:     [['shop','confectionery'],['shop','sweets'],['shop','chocolate']],
  localshop: [['shop','convenience'],['shop','general'],['shop','variety_store']],
  auto:      [['amenity','taxi'],['amenity','auto_rickshaw'],['amenity','motorcycle_taxi']]
};

/* ─── State ─── */
const params = new URLSearchParams(window.location.search);
let serviceType = params.get('type') || 'salon';
let liveOnly = false, currentPlaces = [];
// Default to centre of India (will be overridden immediately by geolocation)
let userLat = 20.5937, userLng = 78.9629;

/* ─── Auth ─── */
sb.auth.getSession().then(({data:{session}})=>{
  const btn = document.getElementById('authBtn');
  if (session) { btn.textContent = 'Dashboard'; btn.href = 'dashboard.html'; }
});

/* ─── Mobile toggle ─── */
function showView(view){
  const listPanel = document.getElementById('listPanel');
  const mapPanel  = document.getElementById('mapPanel');
  document.getElementById('btnList').classList.toggle('active', view==='list');
  document.getElementById('btnMap').classList.toggle('active', view==='map');
  if (view==='map'){
    listPanel.classList.add('hide');
    mapPanel.classList.add('show');
    if (leafletMap) setTimeout(()=>leafletMap.invalidateSize(), 50);
  } else {
    listPanel.classList.remove('hide');
    mapPanel.classList.remove('show');
  }
}

/* ─── Category chips ─── */
document.getElementById('title').textContent = LABELS[serviceType] || 'Nearby Services';
document.querySelectorAll('.chip[data-type]').forEach(chip => {
  if (chip.dataset.type===serviceType) chip.classList.add('active');
  chip.onclick = () => {
    document.querySelectorAll('.chip[data-type]').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    serviceType = chip.dataset.type;
    document.getElementById('title').textContent = LABELS[serviceType];
    executePlacesSearch();
  };
});

/* ─── Live filter ─── */
function toggleLiveOnly(){
  liveOnly = !liveOnly;
  document.getElementById('toggleLive').classList.toggle('active', liveOnly);
  applyLiveFilter();
}
function applyLiveFilter(){
  let count = 0;
  document.querySelectorAll('.place-card').forEach(card=>{
    const live = card.dataset.live==='true';
    if (liveOnly && !live) card.classList.add('hidden');
    else { card.classList.remove('hidden'); count++; }
  });
  document.getElementById('counter').textContent = 'Showing '+count+' results.';
}

/* ─── Map ─── */
let leafletMap = null, placeMarkers = [];

function initLeafletMap(lat, lng){
  leafletMap = L.map('leaflet-map').setView([lat,lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:19
  }).addTo(leafletMap);
  // User dot
  const userIcon = L.divIcon({
    html:`<div style="background:var(--accent);width:14px;height:14px;border-radius:50%;border:3px solid var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.4);"></div>`,
    iconSize:[20,20],iconAnchor:[10,10],className:''
  });
  L.marker([lat,lng],{icon:userIcon}).addTo(leafletMap).bindPopup('<strong>📍 You are here</strong>');
}

function addMapMarkers(places){
  if (!leafletMap) return;
  placeMarkers.forEach(m=>leafletMap.removeLayer(m));
  placeMarkers = [];
  places.forEach((p,i)=>{
    if (!p.location?.lat) return;
    const bg = p.isRegistered ? '#002f34' : '#64748b';
    const icon = L.divIcon({
      html:`<div style="background:${bg};color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid ${p.isRegistered?'#23e5db':'#94a3b8'};">${p.isRegistered?'⚡ ':''}${p.displayName.substring(0,22)}</div>`,
      iconAnchor:[0,24],className:''
    });
    const marker = L.marker([p.location.lat,p.location.lng],{icon})
      .addTo(leafletMap)
      .on('click',()=>selectPlace(i));
    placeMarkers.push(marker);
  });
}

/* ─── Distance ─── */
function haversineDistance(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ─── Overpass (OSM) ─── */
async function searchOverpass(svcType, lat, lng, limit){
  const tags = OVERPASS_TAGS[svcType] || [['amenity','hairdresser']];
  const nodeQ = tags.map(([k,v])=>`node["${k}"="${v}"](around:15000,${lat},${lng});`).join('');
  const query = `[out:json][timeout:15];(${nodeQ});out body ${limit};`;
  const res = await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query));
  if (!res.ok) throw new Error('Overpass '+res.status);
  const data = await res.json();
  return (data.elements||[]).map(el=>{
    const t=el.tags||{};
    let addr='';
    if (t['addr:street']){ addr=((t['addr:housenumber']||'')+' '+t['addr:street']).trim(); if(t['addr:city']) addr+=', '+t['addr:city']; }
    return { id:'osm_'+el.id, displayName:t.name||'', location:{lat:el.lat,lng:el.lon},
      calculatedDistance:haversineDistance(lat,lng,el.lat,el.lon), shortFormattedAddress:addr, isRegistered:false };
  }).filter(p=>p.displayName).sort((a,b)=>a.calculatedDistance-b.calculatedDistance);
}

/* ─── Cache ─── */
const CACHE_TTL=20*24*60*60*1000;
function roundCoord(v){return Math.round(v*100)/100;}
function cacheKey(t,lat,lng){return `${t}_${roundCoord(lat)}_${roundCoord(lng)}`;}
async function readCache(svcType,lat,lng){
  const {data}=await sb.from('places_cache').select('*').eq('cache_key',cacheKey(svcType,lat,lng)).maybeSingle();
  if (!data || new Date(data.expires_at)<new Date()) return null;
  return (data.results||[]).map(p=>({id:p.id,displayName:p.displayName,location:{lat:p.lat,lng:p.lng},
    calculatedDistance:haversineDistance(lat,lng,p.lat,p.lng),shortFormattedAddress:p.address||'',isRegistered:false,fromCache:true}));
}
async function writeCache(svcType,lat,lng,places){
  await sb.from('places_cache').upsert({
    cache_key:cacheKey(svcType,lat,lng),service_type:svcType,
    results:places.slice(0,10).map(p=>({id:p.id,displayName:p.displayName,lat:p.location.lat,lng:p.location.lng,address:p.shortFormattedAddress||''})),
    expires_at:new Date(Date.now()+CACHE_TTL).toISOString()
  });
}

/* ─── Init ─── */
function init(){
  initLeafletMap(userLat, userLng); // init map with default Manchester location immediately

  // Start search after 3s even if geolocation hasn't resolved (prevents infinite "Locating you…")
  let geoResolved = false;
  const geoTimeout = setTimeout(()=>{
    if (!geoResolved){
      geoResolved = true;
      document.getElementById('counter').textContent = '📍 Enable location for results near you';
      executePlacesSearch();
    }
  }, 5000);

  if (!navigator.geolocation){
    clearTimeout(geoTimeout);
    geoResolved = true;
    document.getElementById('counter').textContent = '📍 Location not supported — enable GPS for nearby results';
    executePlacesSearch();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      if (geoResolved) return; // timeout already fired
      geoResolved = true;
      clearTimeout(geoTimeout);
      userLat=pos.coords.latitude; userLng=pos.coords.longitude;
      leafletMap.setView([userLat,userLng],14);
      const userIcon=L.divIcon({html:`<div style="background:var(--accent);width:14px;height:14px;border-radius:50%;border:3px solid var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.4);"></div>`,iconSize:[20,20],iconAnchor:[10,10],className:''});
      L.marker([userLat,userLng],{icon:userIcon}).addTo(leafletMap).bindPopup('<strong>📍 You are here</strong>');
      executePlacesSearch();
    },
    ()=>{
      if (geoResolved) return;
      geoResolved = true;
      clearTimeout(geoTimeout);
      document.getElementById('counter').textContent = '📍 Location unavailable — please enable GPS';
      executePlacesSearch();
    },
    { timeout: 8000, maximumAge: 60000 }
  );
}

/* ─── Main search ─── */
async function executePlacesSearch(){
  const MAX=10;
  const container=document.getElementById('results');
  container.innerHTML=`<p style="padding:20px;color:var(--text-muted);font-size:.85rem;">🔍 Searching nearby services…</p>`;

  const supaPlaces=[];
  try{
    const {data:providers}=await sb.from('providers').select('id,business_name,lat,lng,address,category,is_hospital,capacity,is_open');
    for (const prov of (providers||[])){
      if (!prov.lat||!prov.lng) continue;
      const cat=(prov.category||'').toLowerCase();
      const allowed=CATEGORY_MAP[serviceType]||[];
      if (!allowed.some(k=>cat.includes(k))) continue;
      const dist=haversineDistance(userLat,userLng,prov.lat,prov.lng);
      if (dist*0.000621371>25) continue;

      const {data:qRows}=await sb.from('queues').select('service_duration').eq('provider_id',prov.id).in('status',['waiting','serving']);
      let totalMins=0;
      (qRows||[]).forEach(q=>{let m=parseInt(q.service_duration,10);if(isNaN(m)||m<=0)m=15;totalMins+=m;});
      const capacity=Math.max(1,parseInt(prov.capacity)||1);
      const waitMins=qRows?.length?Math.max(5,Math.ceil(totalMins/capacity)):0;

      supaPlaces.push({
        id:prov.id, displayName:prov.business_name||'Local Partner',
        category:prov.category, is_hospital:prov.is_hospital,
        location:{lat:prov.lat,lng:prov.lng},
        calculatedDistance:dist, shortFormattedAddress:prov.address||'',
        isRegistered:true, waitTime:waitMins, peopleInQueue:qRows?.length||0,
        liveData:{peopleInLine:qRows?.length||0,queueLoadMins:waitMins,currentWaitMins:waitMins}
      });
    }
  }catch(e){console.error('Supabase error:',e);}

  supaPlaces.sort((a,b)=>a.calculatedDistance-b.calculatedDistance);
  const supaLimited=supaPlaces.slice(0,MAX);

  if (supaLimited.length>=MAX){
    currentPlaces=supaLimited; renderList(supaLimited); addMapMarkers(supaLimited); return;
  }

  const shownIds=new Set(supaLimited.map(p=>normalizeName(p.displayName)));
  let osmPlaces=[];
  const cached=await readCache(serviceType,userLat,userLng);
  if (cached?.length){
    osmPlaces=cached;
  } else {
    try{
      osmPlaces=await searchOverpass(serviceType,userLat,userLng,MAX-supaLimited.length);
      if (osmPlaces.length) await writeCache(serviceType,userLat,userLng,osmPlaces);
    }catch(err){
      console.warn('Overpass error:',err);
      container.innerHTML+=`<p style="color:#ef4444;font-size:.8rem;padding:0 1rem;">⚠️ Map data temporarily unavailable.</p>`;
    }
  }
  osmPlaces=osmPlaces.filter(g=>{const n=normalizeName(g.displayName);if(shownIds.has(n))return false;shownIds.add(n);return true;});
  const combined=[...supaLimited,...osmPlaces]
    .sort((a,b)=>{if(a.isRegistered&&!b.isRegistered)return-1;if(!a.isRegistered&&b.isRegistered)return 1;return a.calculatedDistance-b.calculatedDistance;})
    .slice(0,MAX);
  currentPlaces=combined; renderList(combined); addMapMarkers(combined);
}

function normalizeName(n){return (n||'').toLowerCase().replace(/[^a-z0-9]/g,'');}

/* ─── Render cards ─── */
function renderList(places){
  const container=document.getElementById('results');
  container.innerHTML='';
  if (!places.length){
    container.innerHTML=`
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>No services found nearby</h3>
        <p>Try a different category or zoom out your search area.<br>Is your business missing? Register free!</p>
        <a href="provider-signup.html" style="display:inline-block;margin-top:16px;background:var(--primary);color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-size:.82rem;font-weight:700;">Register Your Business →</a>
      </div>`;
    document.getElementById('counter').textContent='No results found.'; return;
  }

  places.forEach((p,i)=>{
    const miles=(p.calculatedDistance*0.000621371).toFixed(1);
    const drive=Math.round((parseFloat(miles)/12)*60)+2;
    const osmDir=`https://www.openstreetmap.org/directions?from=${userLat},${userLng}&to=${p.location.lat},${p.location.lng}`;
    const icon=ICONS[serviceType]||'📍';
    const isHosp = p.category==='Hospital' || p.is_hospital;
    const detailPage = isHosp ? `hospital-detail.html?id=${p.id}` : `business-detail.html?id=${p.id}`;

    const card=document.createElement('div');
    card.className='place-card';
    card.id='card-'+i;
    card.dataset.live = p.isRegistered ? 'true' : 'false';

    if (p.isRegistered){
      const d=p.liveData;
      const waitColor = d.queueLoadMins===0 ? '#065f46' : d.queueLoadMins<15 ? '#065f46' : d.queueLoadMins<30 ? '#854d0e' : '#991b1b';
      const waitBg = d.queueLoadMins===0 ? '#f0fdf4' : d.queueLoadMins<15 ? '#f0fdf4' : d.queueLoadMins<30 ? '#fef9c3' : '#fef2f2';
      const waitBorder = d.queueLoadMins===0 ? '#bbf7d0' : d.queueLoadMins<15 ? '#bbf7d0' : d.queueLoadMins<30 ? '#fde68a' : '#fecaca';
      const waitLabel = d.queueLoadMins===0 ? 'Available now' : `~${d.queueLoadMins} min wait`;

      card.innerHTML=`
        <div class="card-body" onclick="selectPlace(${i})">
          <div class="card-row">
            <div class="card-icon">${isHosp?'🏥':icon}</div>
            <div class="card-main">
              <div class="card-name">⭐ ${esc(p.displayName)}</div>
              <div class="card-meta">
                <span class="meta-pill pill-dist">📍 ${miles} mi</span>
                <span class="meta-pill pill-drive">🚗 ${drive}m drive</span>
              </div>
              <div class="wait-badge live" style="background:${waitBg};border-color:${waitBorder};">
                <div class="wait-dot live"></div>
                <div class="wait-text" style="color:${waitColor};">${waitLabel}</div>
                <div class="wait-sub">${d.peopleInLine} in queue</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <a href="${osmDir}" target="_blank" rel="noopener" class="btn btn-secondary">🗺️ Directions</a>
          <a href="${detailPage}" class="btn btn-primary">View & Join →</a>
        </div>`;
    } else {
      card.innerHTML=`
        <div class="card-body" onclick="selectPlace(${i})">
          <div class="card-row">
            <div class="card-icon unregistered" style="font-size:1.4rem;">${icon}</div>
            <div class="card-main">
              <div class="card-name unregistered">${esc(p.displayName)}</div>
              <div class="card-meta">
                <span class="meta-pill pill-dist">📍 ${miles} mi</span>
                <span class="meta-pill pill-drive">🚗 ${drive}m drive</span>
              </div>
              <div class="wait-badge offline">
                <div class="wait-dot offline"></div>
                <div class="wait-text offline">Not on skipQs yet</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <a href="${osmDir}" target="_blank" rel="noopener" class="btn btn-secondary">🗺️ Directions</a>
          <a href="provider-signup.html" class="btn btn-register">Own this business?<br>Register free →</a>
        </div>`;
    }
    container.appendChild(card);
  });

  document.getElementById('counter').textContent=`Found ${places.length} results nearby.`;
  applyLiveFilter();
}

/* ─── Select place (highlight + map focus) ─── */
function selectPlace(i){
  const p=currentPlaces[i];
  document.querySelectorAll('.place-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('card-'+i).classList.add('active');

  // Mobile: switch to map view
  if (window.innerWidth<769){
    showView('map');
  }

  if (!leafletMap||!p.location) return;
  leafletMap.setView([p.location.lat,p.location.lng],16);

  const osmDir=`https://www.openstreetmap.org/directions?from=${userLat},${userLng}&to=${p.location.lat},${p.location.lng}`;
  const isHosp=p.category==='Hospital'||p.is_hospital;
  const detailPage=isHosp?`hospital-detail.html?id=${p.id}`:`business-detail.html?id=${p.id}`;

  const popup = p.isRegistered
    ?`<div style="min-width:190px;">
        <strong style="font-size:.95rem;color:#002f34;">${esc(p.displayName)}</strong>
        <div style="font-size:.75rem;color:#64748b;margin:3px 0 8px;">${esc(p.shortFormattedAddress)}</div>
        <div style="background:#d1fae5;color:#065f46;padding:6px 10px;border-radius:6px;font-size:.78rem;font-weight:700;margin-bottom:8px;">
          ⚡ ${p.liveData.peopleInLine} in queue · ~${p.liveData.queueLoadMins} min
        </div>
        <a href="${detailPage}" style="display:block;background:#002f34;color:#fff;text-align:center;padding:8px;border-radius:8px;text-decoration:none;font-size:.82rem;font-weight:700;margin-bottom:6px;">VIEW & JOIN QUEUE →</a>
        <a href="${osmDir}" target="_blank" rel="noopener" style="display:block;text-align:center;font-size:.78rem;color:#64748b;">🗺️ Get directions</a>
      </div>`
    :`<div style="min-width:190px;">
        <strong style="font-size:.95rem;">${esc(p.displayName)}</strong>
        <div style="background:#f1f5f9;color:#64748b;padding:6px 10px;border-radius:6px;font-size:.78rem;margin:8px 0;">Not on skipQs yet</div>
        <a href="${osmDir}" target="_blank" rel="noopener" style="display:block;text-align:center;font-size:.78rem;color:#64748b;">🗺️ Get directions</a>
      </div>`;

  L.popup().setLatLng([p.location.lat,p.location.lng]).setContent(popup).openOn(leafletMap);
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

window.addEventListener('DOMContentLoaded', init);
</script>
