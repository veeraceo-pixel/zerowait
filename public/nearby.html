<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Nearby Services | skipQs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --bg-light: #f8fafc; --text-main: #1e293b;
            --text-muted: #64748b; --border: #e2e8f0; --nav-bg: #2d1b4d;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); margin: 0; height: 100vh; overflow: hidden; }
        .navbar { background: var(--nav-bg); padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; position: relative; }
        .logo { font-weight: 800; color: white; text-decoration: none; font-size: 1.2rem; }

        .main-layout { display: flex; height: calc(100vh - 58px); flex-direction: column-reverse; }
        .list-panel { flex: 1; overflow-y: auto; padding: 1.25rem; background: white; border-right: 1px solid var(--border); z-index: 10; }
        .visual-panel { flex: 1.5; background: #0f172a; position: relative; display: flex; flex-direction: column; }
        
        #map { position: absolute; top:0; left:0; width:100%; height:100%; }
        #details-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:#0f172a; display:none; flex-direction: column; z-index: 5; }

        .place-card { padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 12px; background: white; cursor: pointer; transition: 0.2s; }
        .place-card:hover { border-color: var(--primary); }
        .place-card.active { border: 2.5px solid var(--primary); background: #f0f7ff; }

        .card-top { display: flex; gap: 12px; margin-bottom: 12px; }
        .thumb { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #eee; }
        
        .info-tags { display: flex; gap: 8px; margin-top: 5px; align-items: center; }
        .dist-tag { font-size: 0.65rem; color: var(--primary); font-weight: 800; background: #eff6ff; padding: 2px 6px; border-radius: 4px; }
        .time-tag { font-size: 0.65rem; color: #059669; font-weight: 700; }

        .action-row { display: flex; gap: 8px; margin-top: 10px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; text-align: center; cursor: pointer; border: none; text-decoration: none; }
        .btn-join { background: var(--primary); color: white; }
        .btn-reg { background: #475569; color: white; line-height: 1.2; }
        .btn-sec { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }

        .q-badge { font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 4px; margin-top: 5px; display: inline-block; }
        .q-online { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .q-offline { background: #f1f5f9; color: #64748b; }

        #photo-strip { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
        #photo-strip img { height: 100%; min-width: 100%; object-fit: cover; scroll-snap-align: start; }
        #mini-pano { flex: 1; border-top: 2px solid #1e293b; }

        @media (min-width: 769px) { .main-layout { flex-direction: row; } .list-panel { max-width: 400px; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">skipQs</a>
        <div>
            <a href="dashboard.html" style="color:white; text-decoration:none; font-size:0.85rem; margin-right:15px;">My Visits</a>
            <a href="login.html" style="color:white; text-decoration:none; font-size:0.85rem; font-weight:600; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:6px;">Login</a>
        </div>
    </nav>

    <div class="main-layout">
        <div class="list-panel">
            <h2 id="title" style="margin:0; font-size:1.2rem;">Nearby Services</h2>
            <p id="counter" style="font-size:0.7rem; color:var(--text-muted); margin-bottom:1rem;">Locating area...</p>
            <div id="results"></div>
        </div>

        <div class="visual-panel">
            <div id="map"></div>
            <div id="details-overlay">
                <button onclick="closeDetails()" style="position:absolute; top:15px; right:15px; z-index:10; background:rgba(0,0,0,0.7); color:white; border:none; border-radius:50%; width:35px; height:35px; cursor:pointer;">✕</button>
                <div id="photo-strip"></div>
                <div id="mini-pano"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const db = firebase.firestore();
        const params = new URLSearchParams(window.location.search);
        
        // Handle search parameters from index.html
        let serviceType = params.get("type") || 'salon';
        let searchQuery = params.get("q") || '';
        let locationQuery = params.get("l") || '';

        const SERVICE_MAP = {
            salon: { type: "hair_care", keyword: "salon barber hair styling hairdresser beautician beauty parlor unisex haircut fade shave nail cut spa", label: "Salons & Barbers" },
            dining: { type: "restaurant", keyword: "restaurant cafe eatery dining bistro food gastropub steakhouse pizzeria buffet takeaway grill kitchen", label: "Restaurants & Dining" },
            clinic: { type: "health", keyword: "clinic doctor medical dental pharmacy surgery health center physician specialist dentist hospital", label: "Clinics & Health" },
            banking: { type: "bank", keyword: "bank atm financial services credit union finance money transfer exchange", label: "Banking & Finance" },
            gym: { type: "fitness_center", keyword: "gym 'The Gym Group' PureGym fitness center workout yoga studio crossfit health club exercise pilates", label: "Gyms & Fitness" },
            repair: { type: "car_repair", keyword: "auto repair mechanic electronics repair handyman phone repair plumber electrician garage", label: "Repairs & Services" },
            gov: { type: "local_government_office", keyword: "government office post office town hall embassy court library municipal", label: "Gov & Public Services" },
            wash: { type: "car_wash", keyword: "car wash laundry dry cleaning laundromat cleaning services detailer", label: "Wash & Laundry" }
        };

        const config = SERVICE_MAP[serviceType] || SERVICE_MAP.salon;
        document.getElementById("title").innerText = searchQuery ? `Results for "${searchQuery}"` : config.label;

        let map, placesService, userLocation;

        function initMap() {
            const geocoder = new google.maps.Geocoder();

            // 1. Check if user typed a specific city in the search bar
            if (locationQuery && locationQuery.trim() !== "" && locationQuery.toLowerCase() !== "near me") {
                geocoder.geocode({ address: locationQuery }, (results, status) => {
                    if (status === "OK") {
                        userLocation = results[0].geometry.location;
                        setupSearch();
                    } else {
                        // If city not found, try GPS
                        tryGPS();
                    }
                });
            } else {
                tryGPS();
            }
        }

        function tryGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    userLocation = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                    setupSearch();
                }, () => {
                    // Fallback to Manchester
                    userLocation = new google.maps.LatLng(53.4808, -2.2426);
                    setupSearch();
                }, { timeout: 5000 });
            } else {
                userLocation = new google.maps.LatLng(53.4808, -2.2426);
                setupSearch();
            }
        }

        function setupSearch() {
            map = new google.maps.Map(document.getElementById("map"), { center: userLocation, zoom: 14, disableDefaultUI: true });
            placesService = new google.maps.places.PlacesService(map);

            // Combine the category keywords with the user's specific text search
            const finalKeyword = searchQuery ? `${searchQuery} ${config.keyword}` : config.keyword;

            placesService.nearbySearch({
                location: userLocation, 
                radius: 10000, 
                type: config.type, 
                keyword: finalKeyword
            }, (results, status) => {
                if (status === "OK") {
                    results.sort((a, b) => {
                        const dA = google.maps.geometry.spherical.computeDistanceBetween(userLocation, a.geometry.location);
                        const dB = google.maps.geometry.spherical.computeDistanceBetween(userLocation, b.geometry.location);
                        return dA - dB;
                    });
                    renderList(results);
                } else {
                    document.getElementById("counter").innerText = "No results found in this area.";
                }
            });
        }

        function renderList(results) {
            const container = document.getElementById("results");
            container.innerHTML = "";
            document.getElementById("counter").innerText = locationQuery ? `Showing results near ${locationQuery}` : `Found ${results.length} results near you.`;

            results.forEach((place, i) => {
                const rawDist = google.maps.geometry.spherical.computeDistanceBetween(userLocation, place.geometry.location);
                const miles = (rawDist * 0.000621371).toFixed(1);
                const driveTime = Math.round((miles / 12) * 60) + 2; 
                const thumb = place.photos ? place.photos[0].getUrl({maxWidth: 150}) : 'https://via.placeholder.com/150';

                const card = document.createElement('div');
                card.className = 'place-card';
                card.id = `card-${i}`;
                
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}&query_place_id=${place.place_id}`;

                card.innerHTML = `
                    <div onclick="selectPlace(${i}, '${place.place_id}', ${place.geometry.location.lat()}, ${place.geometry.location.lng()})">
                        <div class="card-top">
                            <img src="${thumb}" class="thumb">
                            <div style="flex:1">
                                <strong style="font-size:0.95rem;">${place.name}</strong>
                                <div class="info-tags">
                                    <span class="dist-tag">${miles} mi</span>
                                    <span class="time-tag">🚗 ${driveTime} min drive</span>
                                </div>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${place.vicinity}</span>
                                <div id="status-${i}" class="q-badge q-offline">Checking status...</div>
                            </div>
                        </div>
                    </div>
                    <div class="action-row" id="actions-${i}">
                         <a href="${mapsUrl}" target="_blank" class="btn btn-sec">Directions</a>
                    </div>
                `;
                container.appendChild(card);

                db.collection('providers').where('googlePlaceId', '==', place.place_id).get().then(snap => {
                    const statusDiv = document.getElementById(`status-${i}`);
                    const actionDiv = document.getElementById(`actions-${i}`);
                    if (!snap.empty) {
                        const d = snap.docs[0].data();
                        statusDiv.className = "q-badge q-online";
                        statusDiv.innerText = `LIVE: ${d.queueCount || 0} waiting`;
                        actionDiv.innerHTML += `<button onclick="window.location.href='join-queue.html?id=${snap.docs[0].id}'" class="btn btn-join">JOIN QUEUE</button>`;
                    } else {
                        statusDiv.innerText = "No live queue";
                        actionDiv.innerHTML += `<button onclick="window.location.href='provider-signup.html'" class="btn btn-reg">BUSINESS OWNER?<br>REGISTER FREE</button>`;
                    }
                });
            });
        }

        function selectPlace(index, pid, lat, lng) {
            document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${index}`).classList.add('active');
            document.getElementById('details-overlay').style.display = 'flex';

            placesService.getDetails({ placeId: pid, fields: ['photos'] }, (details) => {
                const strip = document.getElementById('photo-strip');
                if (details && details.photos) {
                    strip.innerHTML = details.photos.slice(0, 5).map(p => `<img src="${p.getUrl({maxWidth: 1000})}">`).join('');
                }
            });

            new google.maps.StreetViewPanorama(document.getElementById("mini-pano"), {
                position: { lat, lng }, pov: { heading: 165, pitch: 0 }, zoom: 1, addressControl: false
            });
        }

        function closeDetails() {
            document.getElementById('details-overlay').style.display = 'none';
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAJFGE5OFfn-OhDNJ_rWO5oi2d2CHl2fXE&libraries=places,geometry&callback=initMap" async defer></script>
</body>
</html>
