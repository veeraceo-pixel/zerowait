<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nearby Services | skipQs - Real-time Queue Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Find salons, clinics, and restaurants nearby with real-time wait times.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --primary: #2563eb; 
            --primary-dark: #1e40af;
            --bg-light: #f8fafc; 
            --text-main: #1e293b;
            --text-muted: #64748b; 
            --border: #e2e8f0; 
            --nav-bg: #2d1b4d;
            --success: #059669; 
            --whatsapp: #25D366;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        /* --- RESET & LAYOUT --- */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-light); 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- NAVIGATION --- */
        .navbar { 
            background: var(--nav-bg); 
            padding: 0.75rem 1.25rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            box-shadow: var(--shadow);
        }
        .logo { font-weight: 800; color: white; text-decoration: none; font-size: 1.3rem; letter-spacing: -0.5px; }

        /* --- SEARCH & FILTER BAR --- */
        .service-filter-bar { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 12px 1.25rem; 
            background: white; 
            border-bottom: 1px solid var(--border); 
            scrollbar-width: none; 
            align-items: center; 
        }
        .service-filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip { 
            white-space: nowrap; 
            padding: 8px 18px; 
            border-radius: 50px; 
            background: var(--bg-light); 
            border: 1px solid var(--border); 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            color: var(--text-muted); 
            transition: all 0.2s ease;
        }
        .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .live-toggle { background: #ecfdf5; color: var(--success); border: 1px solid #34d399; }
        .live-toggle.active { background: var(--success); color: white; }

        /* --- MAIN VIEWPORT --- */
        .main-layout { display: flex; flex: 1; overflow: hidden; flex-direction: column-reverse; }
        
        /* Sidebar */
        .list-panel { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1.25rem; 
            background: white; 
            border-right: 1px solid var(--border); 
            z-index: 10; 
            position: relative;
        }
        
        /* Map Area */
        .visual-panel { flex: 1.5; background: #e2e8f0; position: relative; overflow: hidden; }
        #map { width: 100%; height: 100%; z-index: 1; }
        
        #redo-search { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 20; background: white; color: var(--primary); border: none; 
            padding: 12px 24px; border-radius: 50px; font-weight: 700; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; cursor: pointer; 
        }

        /* --- PLACE CARDS --- */
        .place-card { 
            padding: 1.25rem; 
            margin-bottom: 1rem; 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            background: white; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            position: relative;
        }
        .place-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary); }
        .place-card.active-partner { border: 2px solid var(--primary); background: #f0f7ff; }
        .place-card.hidden { display: none; }
        
        .dist-tag { font-size: 0.7rem; color: var(--primary); font-weight: 800; background: #eff6ff; padding: 3px 8px; border-radius: 6px; }
        .wait-time-badge { margin-top: 10px; display: inline-block; background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }

        /* --- DETAIL OVERLAY --- */
        #details-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65%; 
            background: white; z-index: 30; transform: translateY(100%); 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 24px 24px 0 0; 
            box-shadow: 0 -20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        #details-overlay.open { transform: translateY(0); }
        .details-handle { width: 45px; height: 6px; background: #e2e8f0; border-radius: 10px; margin: 15px auto; cursor: pointer; }
        .pano-img { width: 100%; height: 220px; background: #1e293b; object-fit: cover; }

        .btn { 
            flex: 1; padding: 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; 
            text-align: center; cursor: pointer; border: none; text-decoration: none; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: filter 0.2s;
        }
        .btn:active { filter: brightness(0.9); }
        .btn-join { background: var(--primary); color: white; }
        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-sec { background: #f1f5f9; color: var(--text-main); }

        /* --- LOADING SHIMMER --- */
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; height: 100px; border-radius: 12px; margin-bottom: 10px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* --- DESKTOP OPTIMIZATION --- */
        @media (min-width: 769px) { 
            .main-layout { flex-direction: row; } 
            .list-panel { width: 420px; flex: none; } 
            #details-overlay { width: 400px; height: 100%; right: 0; left: auto; transform: translateX(100%); border-radius: 0; } 
            #details-overlay.open { transform: translateX(0); } 
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">skipQs</a>
        <div>
            <a href="dashboard.html" style="color:white; text-decoration:none; font-size:0.9rem; margin-right:20px; font-weight:500;">My Visits</a>
            <a href="login.html" style="color:white; text-decoration:none; font-size:0.9rem; background:rgba(255,255,255,0.15); padding:8px 16px; border-radius:8px; font-weight:600;">Login</a>
        </div>
    </nav>

    <div class="service-filter-bar">
        <div class="filter-chip live-toggle" id="toggleLive" onclick="toggleLiveOnly()">⚡ Live Only</div>
        <div class="filter-chip" data-type="salon">💇‍♀️ Salons</div>
        <div class="filter-chip" data-type="dining">🍽️ Dining</div>
        <div class="filter-chip" data-type="clinic">🏥 Clinics</div>
        <div class="filter-chip" data-type="repair">🛠️ Repairs</div>
    </div>

    <div class="main-layout">
        <div class="list-panel">
            <h2 id="title" style="margin:0; font-size:1.4rem; font-weight:800;">Finding Services</h2>
            <p id="counter" style="font-size:0.8rem; color:var(--text-muted); margin: 5px 0 20px 0;">Searching your current location...</p>
            <div id="results">
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
            </div>
        </div>

        <div class="visual-panel">
            <button id="redo-search" onclick="redoSearch()">🔄 Search this area</button>
            <div id="map"></div>
            
            <div id="details-overlay">
                <div class="details-handle" onclick="closeDetails()"></div>
                <img id="detail-img" class="pano-img" src="">
                <div style="padding: 24px; flex: 1; overflow-y: auto;">
                    <h3 id="detail-name" style="margin:0; font-size: 1.5rem; font-weight:800; color: var(--text-main);">Shop Name</h3>
                    <p id="detail-addr" style="font-size:0.95rem; color:var(--text-muted); margin: 10px 0 25px 0; line-height:1.5;"></p>
                    <div id="detail-actions" class="action-row" style="display:flex; gap:12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

    <script>
        const db = window.db || firebase.firestore();
        const MAPBOX_TOKEN = 'pk.eyJ1IjoidmVlcmFjZW8iLCJhIjoiY21rY2h5ZmQ2MDEzaTNlc2NqdTV0ZWowNiJ9.x8KNnadUqOuINdXV7g7Zbw';
        
        let map, userLat, userLng, markers = [], liveOnly = false;
        const params = new URLSearchParams(window.location.search);
        let serviceType = params.get("type") || 'salon';

        const SERVICE_MAP = {
            salon: { query: "hair salon barber", label: "Salons & Barbers", cat: "Salon" },
            dining: { query: "restaurant cafe food", label: "Dining & Drinks", cat: "Dining" },
            clinic: { query: "medical clinic doctor dentist", label: "Clinics", cat: "Clinic" },
            repair: { query: "car repair mechanic service", label: "Repairs", cat: "Repair" }
        };

        function init() {
            L.Icon.Default.imagePath = 'https://unpkg.com/leaflet@1.9.4/dist/images/';
            document.getElementById("title").innerText = SERVICE_MAP[serviceType].label;
            
            document.querySelectorAll('.filter-chip[data-type]').forEach(chip => {
                if(chip.dataset.type === serviceType) chip.classList.add('active');
                chip.onclick = () => {
                    location.href = `nearby.html?type=${chip.dataset.type}&l=${encodeURIComponent(params.get('l') || 'near me')}`;
                };
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
                    setupMap(userLat, userLng);
                }, () => setupMap(53.4808, -2.2426));
            } else { setupMap(53.4808, -2.2426); }
        }

        function setupMap(lat, lng) {
            if (map) map.remove();
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([lat, lng], 14);
            L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v11/tiles/{z}/{x}/{y}?access_token=${MAPBOX_TOKEN}`, {
                tileSize: 512, zoomOffset: -1
            }).addTo(map);

            map.on('dragend', () => { document.getElementById('redo-search').style.display = 'block'; });
            performSearch();
        }

        async function performSearch() {
            const container = document.getElementById("results");
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            try {
                const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(SERVICE_MAP[serviceType].query)}.json?proximity=${userLng},${userLat}&limit=25&access_token=${MAPBOX_TOKEN}`;
                const resp = await fetch(url);
                const data = await resp.json();

                const fbSnap = await db.collection('providers').where('category', '==', SERVICE_MAP[serviceType].cat).get();
                const partners = {};
                fbSnap.forEach(doc => {
                    const d = doc.data();
                    partners[d.businessName.toLowerCase().trim()] = {id: doc.id, ...d};
                });

                container.innerHTML = "";
                
                const sortedFeatures = data.features.sort((a, b) => {
                    const isAPartner = partners[a.text.toLowerCase().trim()] ? 1 : 0;
                    const isBPartner = partners[b.text.toLowerCase().trim()] ? 1 : 0;
                    return isBPartner - isAPartner;
                });

                sortedFeatures.forEach((place) => {
                    const name = place.text;
                    const partner = partners[name.toLowerCase().trim()];
                    const [pLng, pLat] = place.center;
                    
                    // Fixed Distance logic for Salford [Lat, Lng]
                    const dist = (L.latLng(userLat, userLng).distanceTo(L.latLng(pLat, pLng)) * 0.000621371).toFixed(1);

                    const card = document.createElement('div');
                    card.className = `place-card ${partner ? 'active-partner' : ''}`;
                    card.setAttribute('data-live', !!partner);
                    card.innerHTML = `
                        <div onclick="openDetails('${name.replace(/'/g, "\\'")}', '${place.place_name.replace(/'/g, "\\'")}', ${pLat}, ${pLng}, '${partner?.id || ''}', '${partner?.phone || ''}')">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <strong style="font-size:1.1rem; color:var(--text-main);">${name}</strong>
                                <span class="dist-tag">${dist} mi</span>
                            </div>
                            <div style="margin-top:8px;">
                                ${partner ? `<span class="wait-time-badge">⚡ ${partner.currentWaitMins || 0}m Wait</span>` : `<span style="font-size:0.75rem; color:var(--text-muted);">Standard Listing</span>`}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);

                    const m = L.circleMarker([pLat, pLng], {
                        radius: 10, fillColor: partner ? "#2563eb" : "#64748b", color: "#fff", weight: 2, fillOpacity: 1
                    }).addTo(map).on('click', () => {
                        openDetails(name, place.place_name, pLat, pLng, partner?.id, partner?.phone);
                    });
                    markers.push(m);
                });
                document.getElementById("counter").innerText = `Found ${data.features.length} locations nearby`;
            } catch (err) { console.error(err); }
        }

        function openDetails(name, addr, lat, lng, id, phone) {
            document.getElementById('detail-name').innerText = name;
            document.getElementById('detail-addr').innerText = addr;
            document.getElementById('detail-img').src = `https://api.mapbox.com/styles/v1/mapbox/streets-v11/static/${lng},${lat},16,0/800x450?access_token=${MAPBOX_TOKEN}`;
            
            let actions = `<a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="btn btn-sec">Directions</a>`;
            if(id) actions += `<button onclick="location.href='join-queue.html?id=${id}'" class="btn btn-join">JOIN QUEUE</button>`;
            if(phone) actions += `<a href="https://wa.me/${phone.replace(/\D/g,'')}" target="_blank" class="btn btn-whatsapp">WhatsApp</a>`;
            
            document.getElementById('detail-actions').innerHTML = actions;
            document.getElementById('details-overlay').classList.add('open');
            map.flyTo([lat, lng], 15, { animate: true, duration: 1.5 });
        }

        function closeDetails() { document.getElementById('details-overlay').classList.remove('open'); }
        function redoSearch() { 
            const center = map.getCenter(); userLat = center.lat; userLng = center.lng; 
            document.getElementById('redo-search').style.display='none'; 
            performSearch(); 
        }
        function toggleLiveOnly() {
            liveOnly = !liveOnly;
            document.getElementById('toggleLive').classList.toggle('active', liveOnly);
            document.querySelectorAll('.place-card').forEach(c => {
                c.classList.toggle('hidden', liveOnly && c.getAttribute('data-live') !== 'true');
            });
        }
        window.onload = init;
    </script>
</body>
</html>
