<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | skipQs Partner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --sidebar-width: 260px;
        }
        body { background: #f8fafc; display: flex; min-height: 100vh; }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            background: #0f172a;
            color: white;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }
        .sidebar-nav { margin-top: 2rem; flex-grow: 1; }
        .nav-item {
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            display: block;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
        }
        .nav-item.active, .nav-item:hover {
            background: var(--primary);
            color: white;
        }

        /* Main Content Styling */
        .main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .queue-container {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .queue-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-toggle {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .status-open { background: #dcfce7; color: #166534; }
        .status-closed { background: #fee2e2; color: #991b1b; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 1rem 1.5rem; background: #f8fafc; font-size: 0.8rem; color: #64748b; }
        td { padding: 1rem 1.5rem; border-bottom: 1px solid #f1f5f9; }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-complete { background: var(--primary); color: white; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo" style="color: white; font-size: 1.5rem;">skipQs</div>
    <nav class="sidebar-nav">
        <a href="#" class="nav-item active">Live Queue</a>
        <a href="services-manage.html" class="nav-item">Services</a>
        <a href="analytics.html" class="nav-item">Analytics</a>
        <a href="settings.html" class="nav-item">Business Profile</a>
    </nav>
    <button onclick="handleLogout()" class="nav-item" style="background:none; border:none; width:100%; text-align:left; cursor:pointer;">Logout</button>
</aside>

<main class="main-content">
    <header class="dashboard-header">
        <div>
            <h1 id="welcomeName" style="margin:0;">Loading...</h1>
            <p style="color: #64748b; margin: 0.2rem 0 0 0;">Manage your live bookings today.</p>
        </div>
        <button id="shopStatusBtn" class="status-toggle status-closed" onclick="toggleShopStatus()">Shop is CLOSED</button>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <small style="color:#64748b;">Waiting Now</small>
            <h2 id="waitingCount" style="margin: 0.5rem 0 0 0;">0</h2>
        </div>
        <div class="stat-card">
            <small style="color:#64748b;">Completed Today</small>
            <h2 id="completedCount" style="margin: 0.5rem 0 0 0;">0</h2>
        </div>
        <div class="stat-card">
            <small style="color:#64748b;">Estimated Wait</small>
            <h2 id="estWaitTime" style="margin: 0.5rem 0 0 0;">0 mins</h2>
        </div>
    </div>

    <div class="queue-container">
        <div class="queue-header">
            <h3 style="margin:0;">Current Queue</h3>
            <span id="liveIndicator" style="color: #10b981; font-size: 0.8rem;">● Live Updates On</span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Service</th>
                    <th>Booked At</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="queueList">
                <tr>
                    <td colspan="5" style="text-align:center; color:#94a3b8;">No customers in queue</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
    const db = firebase.firestore();
    let currentUser = null;

    // 1. Auth Check
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            loadBusinessData();
            initQueueListener();
        } else {
            window.location.href = 'login.html';
        }
    });

    // 2. Load Business Name & Status
    async function loadBusinessData() {
        const doc = await db.collection('providers').doc(currentUser.uid).get();
        if (doc.exists) {
            const data = doc.data();
            document.getElementById('welcomeName').innerText = data.businessName;
            updateStatusUI(data.isOpen);
        }
    }

    function updateStatusUI(isOpen) {
        const btn = document.getElementById('shopStatusBtn');
        if (isOpen) {
            btn.innerText = "Shop is OPEN";
            btn.className = "status-toggle status-open";
        } else {
            btn.innerText = "Shop is CLOSED";
            btn.className = "status-toggle status-closed";
        }
    }

    // 3. Toggle Open/Closed Status
    async function toggleShopStatus() {
        const btn = document.getElementById('shopStatusBtn');
        const newStatus = btn.classList.contains('status-closed');
        
        try {
            await db.collection('providers').doc(currentUser.uid).update({
                isOpen: newStatus
            });
            updateStatusUI(newStatus);
        } catch (e) { alert("Error updating status"); }
    }

    // 4. Live Queue Listener
    function initQueueListener() {
        db.collection('bookings')
            .where('providerId', '==', currentUser.uid)
            .where('status', '==', 'waiting')
            .orderBy('timestamp', 'asc')
            .onSnapshot(snapshot => {
                const tbody = document.getElementById('queueList');
                tbody.innerHTML = '';
                
                document.getElementById('waitingCount').innerText = snapshot.size;

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No customers waiting</td></tr>';
                    return;
                }

                snapshot.forEach(doc => {
                    const b = doc.data();
                    const time = b.timestamp?.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight:bold;">${b.customerName}</td>
                        <td>${b.serviceName}</td>
                        <td>${time || 'Just now'}</td>
                        <td><span style="background:#fef3c7; color:#92400e; padding:4px 8px; border-radius:4px; font-size:0.75rem;">Waiting</span></td>
                        <td>
                            <button onclick="completeBooking('${doc.id}')" class="btn-action btn-complete">Complete</button>
                            <button onclick="cancelBooking('${doc.id}')" style="background:none; border:none; color:red; cursor:pointer; margin-left:10px;">×</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    }

    async function completeBooking(id) {
        await db.collection('bookings').doc(id).update({ status: 'completed' });
    }

    async function cancelBooking(id) {
        if(confirm("Cancel this booking?")) {
            await db.collection('bookings').doc(id).update({ status: 'cancelled' });
        }
    }

    function handleLogout() {
        firebase.auth().signOut();
    }
</script>
</body>
</html>
