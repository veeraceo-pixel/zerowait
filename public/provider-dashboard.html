<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Provider dashboard | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="sq-header">
    <div class="sq-container sq-header-inner">
      <div class="sq-logo">skip<span>Qs</span></div>
      <nav class="sq-nav">
        <a href="/provider-dashboard.html" class="active">Dashboard</a>
      </nav>
      <div class="sq-header-actions">
        <button id="logout-btn" class="sq-btn sq-btn-ghost">Log out</button>
      </div>
    </div>
  </header>

  <main class="sq-main">
    <section class="sq-section">
      <div class="sq-container">
        <h1>Provider dashboard</h1>
        <p class="sq-subtle">Manage your live queue.</p>

        <div id="provider-info" class="sq-card"></div>

        <h2>Current queue</h2>
        <div id="provider-queue-list" class="sq-queue-list"></div>
        <div id="provider-queue-empty" class="sq-empty-state" hidden>
          <h3>No one in queue</h3>
          <p>When customers join, they will appear here.</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      getProviderProfile,
      getProviderQueue,
      updateQueueStatus,
      logout
    } from './api.js';

    const infoEl = document.getElementById('provider-info');
    const listEl = document.getElementById('provider-queue-list');
    const emptyEl = document.getElementById('provider-queue-empty');
    const logoutBtn = document.getElementById('logout-btn');

    logoutBtn.addEventListener('click', async () => {
      await logout();
      window.location.href = '/';
    });

    async function renderDashboard() {
      const user = await window.sqGetCurrentUser();
      if (!user) {
        window.location.href = '/login.html';
        return;
      }

      const provider = await getProviderProfile(user.id);
      if (!provider) {
        infoEl.innerHTML = '<p class="sq-subtle">No provider profile found for this account.</p>';
        return;
      }

      infoEl.innerHTML = `
        <h2>${provider.business_name}</h2>
        <p class="sq-subtle">${provider.address || ''}</p>
        <div class="sq-queue-status">
          <div>
            <span class="sq-label">People in line</span>
            <span class="sq-value">${provider.people_in_line ?? 0}</span>
          </div>
          <div>
            <span class="sq-label">Current wait</span>
            <span class="sq-value">${provider.current_wait_mins ?? 0} mins</span>
          </div>
          <div>
            <span class="sq-label">Status</span>
            <span class="sq-value">${provider.is_open ? 'Open' : 'Closed'}</span>
          </div>
        </div>
      `;

      const queue = await getProviderQueue(provider.id);
      listEl.innerHTML = '';

      if (!queue.length) {
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;

      queue.forEach((q, index) => {
        const card = document.createElement('article');
        card.className = 'sq-queue-card';

        card.innerHTML = `
          <header class="sq-queue-card-header">
            <h3>${q.customer_name}</h3>
            <span class="sq-badge">${q.selected_service || 'Service'}</span>
          </header>
          <p class="sq-subtle">Joined at ${new Date(q.joined_at).toLocaleTimeString()}</p>
          <div class="sq-queue-status">
            <div>
              <span class="sq-label">Position</span>
              <span class="sq-value">${index + 1}</span>
            </div>
            <div>
              <span class="sq-label">Duration</span>
              <span class="sq-value">${q.service_duration} mins</span>
            </div>
            <div>
              <span class="sq-label">Status</span>
              <span class="sq-value">${q.status}</span>
            </div>
          </div>
          <div class="sq-cta-row">
            <button class="sq-btn sq-btn-primary" data-action="call" data-id="${q.id}">
              Call next
            </button>
            <button class="sq-btn sq-btn-ghost" data-action="complete" data-id="${q.id}">
              Complete
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });

      listEl.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const id = btn.dataset.id;
        const action = btn.dataset.action;

        if (action === 'call') {
          await updateQueueStatus(id, 'serving');
        } else if (action === 'complete') {
          await updateQueueStatus(id, 'completed');
        }
        renderDashboard();
      }, { once: true });
    }

    renderDashboard();
    setInterval(renderDashboard, 15_000);
  </script>
</body>
</html>
