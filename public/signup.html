<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign up | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="sq-main">
    <section class="sq-section">
      <div class="sq-container sq-grid-2">
        <div>
          <h1>Create your account</h1>
          <p class="sq-subtle">Join queues and track your turn.</p>
        </div>
        <div class="sq-card">
          <form id="signup-form" class="sq-form">
            <label>
              <span>Email</span>
              <input type="email" name="email" required />
            </label>
            <label>
              <span>Password</span>
              <input type="password" name="password" minlength="6" required />
            </label>
            <button type="submit" class="sq-btn sq-btn-primary">Sign up</button>
            <p id="signup-message" class="sq-form-message"></p>
            <p class="sq-subtle">
              Already have an account? <a href="/login.html">Log in</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { signup } from './api.js';

    const form = document.getElementById('signup-form');
    const msg = document.getElementById('signup-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'sq-form-message';

      const data = Object.fromEntries(new FormData(form).entries());
      msg.textContent = 'Creating your account…';

      const result = await signup(data.email, data.password);
      if (result.error) {
        msg.textContent = result.error;
        msg.classList.add('error');
      } else {
        msg.textContent = 'Account created. Check your email to confirm.';
        msg.classList.add('success');
        setTimeout(() => {
          window.location.href = '/';
        }, 1200);
      }
    });
  </script>
</body>
</html>
