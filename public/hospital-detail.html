<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Wait Times | skipQs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#002f34;--accent:#23e5db;--accent2:#ffce32;--bg:#f7f8f8;--border:#e2e8f0;--danger:#dc2626;--success:#059669;--warning:#d97706;--text-muted:#406367;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--primary);line-height:1.55;}
.container{max-width:1100px;margin:0 auto;padding:0 20px;}
header{background:white;padding:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;}
.header-content{display:flex;align-items:center;gap:16px;}
.logo{font-size:26px;font-weight:800;color:var(--primary);text-decoration:none;letter-spacing:-1.5px;}
.logo span{color:var(--accent);}
.spacer{flex:1;}
.btn{padding:9px 18px;border-radius:50px;font-weight:700;text-decoration:none;font-size:13px;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:.3rem;}
.btn-primary{background:var(--accent);color:var(--primary);}
.btn-ghost{background:var(--bg);color:var(--primary);border:1px solid var(--border);}
.back{color:var(--text-muted);text-decoration:none;font-size:13px;font-weight:600;}
.back:hover{color:var(--primary);}
.hero{background:linear-gradient(135deg,#002f34 0%,#004d57 50%,#002f34 100%);color:white;padding:2.4rem 0;}
.hero-flex{display:flex;justify-content:space-between;align-items:flex-start;gap:1.4rem;flex-wrap:wrap;}
.hero h1{font-size:2rem;font-weight:800;letter-spacing:-.6px;margin-bottom:.4rem;}
.hero .addr{font-size:.95rem;opacity:.7;margin-bottom:.2rem;}
.hero .meta{font-size:.85rem;opacity:.6;}
.hero-stats{display:flex;gap:1rem;}
.hero-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:.9rem 1.2rem;min-width:120px;}
.hero-stat-value{font-size:1.7rem;font-weight:800;color:var(--accent);line-height:1;}
.hero-stat-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;opacity:.6;font-weight:700;margin-top:.2rem;}
.status-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(16,185,129,.95);padding:4px 12px;border-radius:50px;font-size:.7rem;font-weight:800;margin-bottom:.6rem;}
.status-pill.closed{background:rgba(156,163,175,.85);}
.live-dot{width:6px;height:6px;border-radius:50%;background:white;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.section-bar{background:white;border-bottom:1px solid var(--border);padding:.9rem 0;font-size:.82rem;color:var(--text-muted);}
.live-badge{display:inline-flex;align-items:center;gap:.4rem;color:var(--success);font-weight:700;}
main{padding:1.6rem 0 4rem;}
.section-title{font-size:1.25rem;font-weight:800;margin-bottom:.6rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;}
.subtle{font-size:.85rem;color:var(--text-muted);margin-bottom:1.2rem;}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;}
.dept-card{background:white;border-radius:16px;border:1px solid var(--border);padding:1.2rem;transition:.2s;display:flex;flex-direction:column;gap:.8rem;}
.dept-card:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.06);}
.dept-card.closed{opacity:.6;}
.dept-head{display:flex;align-items:center;gap:.8rem;}
.dept-icon{font-size:2.2rem;}
.dept-title{font-size:1.05rem;font-weight:800;margin-bottom:.1rem;}
.dept-status{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.dept-status.open{color:var(--success);}
.dept-status.closed{color:#9ca3af;}
.dept-status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:.3rem;}
.wait-display{background:var(--bg);border-radius:12px;padding:1rem;text-align:center;}
.wait-num{font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-1px;}
.wait-num.low{color:var(--success);}
.wait-num.med{color:var(--warning);}
.wait-num.high{color:var(--danger);}
.wait-unit{font-size:.85rem;color:var(--text-muted);font-weight:600;display:block;margin-top:.2rem;}
.dept-meta{font-size:.78rem;color:var(--text-muted);display:flex;justify-content:space-between;}
.dept-cta{padding:.7rem;background:var(--primary);color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem;text-decoration:none;text-align:center;}
.dept-cta:hover{background:#001f24;}
.dept-cta.disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;pointer-events:none;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);background:white;border-radius:16px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--primary);color:white;padding:.9rem 1.4rem;border-radius:50px;font-weight:600;font-size:.9rem;z-index:2000;transition:.3s;opacity:0;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.modal.show{display:flex;}
.modal-card{background:white;border-radius:18px;padding:1.6rem;max-width:420px;width:100%;}
.modal-card h3{margin-bottom:.4rem;font-size:1.2rem;}
.modal-card p{font-size:.88rem;color:var(--text-muted);margin-bottom:1rem;}
.modal-card label{font-size:.85rem;font-weight:600;display:block;margin-bottom:.3rem;}
.modal-card input{width:100%;padding:.85rem 1rem;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.95rem;margin-bottom:1rem;}
.modal-card input:focus{outline:none;border-color:var(--accent);}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;}
.modal-actions .btn-primary{background:var(--primary);color:white;padding:.7rem 1.4rem;}
@media(max-width:700px){
  .hero-flex{flex-direction:column;}
  .hero-stats{width:100%;}
  .hero-stat{flex:1;min-width:0;}
  .hero h1{font-size:1.6rem;}
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-content">
      <a href="index.html" class="logo">skip<span>Qs</span></a>
      <a href="hospitals.html" class="back">← All hospitals</a>
      <div class="spacer"></div>
      <a href="login.html" class="btn btn-ghost" id="loginBtn">Login</a>
      <a href="my-queues.html" class="btn btn-primary" id="myQueuesBtn" style="display:none;">My Queues</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container" id="heroContent">
    <div style="opacity:.6;">Loading hospital…</div>
  </div>
</section>

<div class="section-bar">
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;">
    <div>📡 <span class="live-badge"><span class="live-dot" style="background:var(--success);"></span>Live wait times</span> · auto-refresh on changes</div>
    <div id="lastSync">—</div>
  </div>
</div>

<main>
  <div class="container">
    <h2 class="section-title">Departments</h2>
    <div class="subtle">Tap a department to join its queue. Wait times come straight from the hospital staff.</div>
    <div class="dept-grid" id="deptGrid">
      <div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted);">Loading departments…</div>
    </div>
  </div>
</main>

<div class="modal" id="joinModal">
  <div class="modal-card">
    <h3 id="joinTitle">Join Queue</h3>
    <p id="joinSub">You'll get a virtual ticket — no need to wait at the hospital.</p>
    <label for="patientName">Patient Name</label>
    <input type="text" id="patientName" placeholder="Full name">
    <label for="patientPhone">Phone (for SMS updates)</label>
    <input type="tel" id="patientPhone" placeholder="07xxx xxxxxx">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeJoin()">Cancel</button>
      <button class="btn btn-primary" id="joinSubmitBtn" onclick="confirmJoin()">Join Queue</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>
<script>
const params = new URLSearchParams(location.search);
const hospitalId = params.get('id');
let provider = null;
let departments = [];
let session = null;
let pendingDept = null;

function toast(msg, kind='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  setTimeout(()=>{ t.className='toast'; }, 2800);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function init() {
  if (!hospitalId) {
    document.getElementById('heroContent').innerHTML = `<h1>Hospital not found</h1><a href="hospitals.html" class="btn btn-primary" style="margin-top:1rem;">Browse hospitals</a>`;
    document.getElementById('deptGrid').innerHTML = '';
    return;
  }

  // Auth check (non-blocking)
  const r = await sb.auth.getSession();
  session = r?.data?.session;
  if (session) {
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('myQueuesBtn').style.display='inline-flex';
  }

  await loadAll();

  // Realtime updates
  sb.channel('hosp-detail-' + hospitalId)
    .on('postgres_changes', {event:'*', schema:'public', table:'departments', filter:`provider_id=eq.${hospitalId}`}, async ()=>{
      await loadDepartments(); renderDepartments();
      document.getElementById('lastSync').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'providers', filter:`id=eq.${hospitalId}`}, async ()=>{
      await loadProvider(); renderHero();
    })
    .subscribe();
}

async function loadAll() {
  await loadProvider();
  if (!provider) return;
  await loadDepartments();
  renderHero();
  renderDepartments();
  document.getElementById('lastSync').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

async function loadProvider() {
  const { data, error } = await sb.from('providers').select('*').eq('id', hospitalId).maybeSingle();
  if (error || !data) {
    document.getElementById('heroContent').innerHTML = `<h1>Hospital not found</h1><a href="hospitals.html" class="btn btn-primary" style="margin-top:1rem;display:inline-block;">Browse all hospitals</a>`;
    document.getElementById('deptGrid').innerHTML='';
    return;
  }
  provider = data;
}

async function loadDepartments() {
  const { data } = await sb.from('departments').select('*').eq('provider_id', hospitalId).order('display_order',{ascending:true});
  departments = data || [];
}

function renderHero() {
  const isOpen = provider.is_open;
  const openDepts = departments.filter(d => d.is_open);
  const avg = openDepts.length ? Math.round(openDepts.reduce((s,d)=>s+(d.wait_minutes||0),0)/openDepts.length) : 0;
  const shortest = openDepts.length ? Math.min(...openDepts.map(d=>d.wait_minutes||0)) : '—';
  const longest  = openDepts.length ? Math.max(...openDepts.map(d=>d.wait_minutes||0)) : '—';

  document.getElementById('heroContent').innerHTML = `
    <div class="hero-flex">
      <div>
        <div class="status-pill ${isOpen?'':'closed'}">${isOpen?'<div class="live-dot"></div> OPEN NOW':'CLOSED'}</div>
        <h1>${esc(provider.business_name)}</h1>
        <div class="addr">📍 ${esc(provider.address || 'Address not set')}</div>
        <div class="meta">${provider.phone ? '📞 ' + esc(provider.phone) : ''}</div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hero-stat-value">${departments.length}</div><div class="hero-stat-label">Departments</div></div>
        <div class="hero-stat"><div class="hero-stat-value">${shortest}</div><div class="hero-stat-label">Shortest (min)</div></div>
        <div class="hero-stat"><div class="hero-stat-value">${avg}</div><div class="hero-stat-label">Avg (min)</div></div>
        <div class="hero-stat"><div class="hero-stat-value">${longest}</div><div class="hero-stat-label">Longest (min)</div></div>
      </div>
    </div>`;
}

function renderDepartments() {
  if (!departments.length) {
    document.getElementById('deptGrid').innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        <h3>No departments listed yet</h3>
        <p>The hospital hasn't added any departments. Please check back later.</p>
      </div>`;
    return;
  }
  // Sort: open first, then shortest wait first
  const sorted = [...departments].sort((a,b)=>{
    if (a.is_open !== b.is_open) return a.is_open ? -1 : 1;
    return (a.wait_minutes||0) - (b.wait_minutes||0);
  });
  document.getElementById('deptGrid').innerHTML = sorted.map(deptCard).join('');
}

function deptCard(d) {
  const isOpen = d.is_open && provider.is_open;
  const w = d.wait_minutes || 0;
  const cls = w === 0 ? 'low' : w > 60 ? 'high' : w > 30 ? 'med' : 'low';
  return `
    <div class="dept-card ${isOpen?'':'closed'}">
      <div class="dept-head">
        <div class="dept-icon">${esc(d.icon||'🏥')}</div>
        <div>
          <div class="dept-title">${esc(d.name)}</div>
          <div class="dept-status ${isOpen?'open':'closed'}"><span class="dot"></span>${isOpen?'OPEN':'CLOSED'}</div>
        </div>
      </div>
      <div class="wait-display">
        <div class="wait-num ${cls}">${isOpen ? w : '—'}</div>
        <span class="wait-unit">${isOpen ? 'minutes wait' : 'currently closed'}</span>
      </div>
      <div class="dept-meta">
        <span>👥 ${d.capacity} concurrent</span>
        <span>⏱ ${d.avg_consult_minutes||15} min/visit</span>
      </div>
      ${isOpen
        ? `<button class="dept-cta" onclick="openJoin('${d.id}')">Join Queue →</button>`
        : `<button class="dept-cta disabled">Closed</button>`}
    </div>`;
}

function openJoin(deptId) {
  pendingDept = departments.find(d => d.id === deptId);
  if (!pendingDept) return;
  if (!session) {
    sessionStorage.setItem('redirectAfterLogin', location.href);
    toast('Please log in to join a queue', 'error');
    setTimeout(()=>{ window.location.href = 'login.html'; }, 1200);
    return;
  }
  document.getElementById('joinTitle').textContent = 'Join ' + pendingDept.name + ' Queue';
  document.getElementById('joinSub').textContent = `Wait time right now: ~${pendingDept.wait_minutes||0} minutes`;
  document.getElementById('patientName').value = (session.user.user_metadata?.full_name) || '';
  document.getElementById('patientPhone').value = '';
  document.getElementById('joinModal').classList.add('show');
}

function closeJoin() { document.getElementById('joinModal').classList.remove('show'); }

async function confirmJoin() {
  const name = document.getElementById('patientName').value.trim();
  const phone = document.getElementById('patientPhone').value.trim();
  if (!name) { toast('Please enter your name', 'error'); return; }
  if (!phone) { toast('Please enter your phone number', 'error'); return; }

  const btn = document.getElementById('joinSubmitBtn');
  btn.disabled = true; btn.textContent = 'Joining…';

  try {
    const { error } = await sb.from('queues').insert({
      provider_id: provider.id,
      department_id: pendingDept.id,
      user_id: session.user.id,
      customer_name: name,
      customer_phone: phone,
      service_duration: pendingDept.avg_consult_minutes || 15,
      status: 'waiting'
    });
    if (error) {
      if (error.code === '23505' || /one_active_queue_per_user/.test(error.message)) {
        toast('You already have an active queue', 'error');
      } else {
        toast('Could not join: ' + error.message, 'error');
      }
      return;
    }
    closeJoin();
    toast('🎉 You are in the queue! Redirecting to your dashboard…', 'success');
    setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 1800);
  } finally {
    btn.disabled = false; btn.textContent = 'Join Queue';
  }
}

document.getElementById('joinModal').addEventListener('click', e => {
  if (e.target.id === 'joinModal') closeJoin();
});

init();
</script>
</body>
</html>
