<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Services | skipQs</title>
  <link rel="canonical" href="https://skipqs.com/nearby.html">
  <script>
    // Redirect to nearby.html preserving any ?q= search param
    const q = new URLSearchParams(window.location.search).get('q');
    window.location.replace(q ? 'nearby.html?q=' + encodeURIComponent(q) : 'nearby.html');
  </script>
</head>
<body></body>
</html>
