<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | skipQs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#002f34;--accent:#23e5db;--bg-light:#f7f8f8;--text-main:#002f34;--text-muted:#64748b;--white:#fff;--shadow:0 10px 15px -3px rgba(0,0,0,.1);--border:#e2e8f0;--success:#059669;--danger:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg-light);display:flex;flex-direction:column;min-height:100vh;}
    .navbar{background:var(--primary);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:1.5rem;font-weight:800;color:var(--accent);text-decoration:none;letter-spacing:-1px;}
    .navbar-back{color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem;font-weight:600;}
    .navbar-back:hover{color:white;}
    .auth-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .auth-card{background:var(--white);width:100%;max-width:420px;padding:2.5rem;border-radius:1.25rem;box-shadow:var(--shadow);}
    .auth-icon{font-size:2.5rem;margin-bottom:1rem;display:block;}
    .auth-header h1{font-size:1.8rem;margin:0 0 .5rem;color:#0f172a;}
    .auth-header p{color:var(--text-muted);margin-bottom:1.5rem;font-size:.95rem;line-height:1.55;}
    .form-group{margin-bottom:1.25rem;text-align:left;}
    .form-label{display:block;font-size:.875rem;font-weight:600;margin-bottom:.5rem;color:var(--primary);}
    .form-control{width:100%;padding:.8rem 1rem;border:1.5px solid var(--border);border-radius:.6rem;font-size:1rem;font-family:inherit;transition:border-color .2s;background:white;}
    .form-control:focus{outline:none;border-color:var(--accent);}
    .btn-submit{width:100%;background:var(--primary);color:white;padding:1rem;border:none;border-radius:.6rem;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s;font-family:inherit;}
    .btn-submit:hover{opacity:.88;}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;}
    .alert{border-radius:.5rem;padding:.85rem 1rem;font-size:.875rem;margin-bottom:1rem;display:none;line-height:1.4;}
    .alert-error{background:#fee2e2;color:#b91c1c;}
    .alert-success{background:#d1fae5;color:#065f46;}
    .auth-footer{margin-top:1.5rem;text-align:center;font-size:.9rem;color:var(--text-muted);}
    .auth-footer a{color:var(--primary);text-decoration:none;font-weight:600;}
    .auth-footer a:hover{text-decoration:underline;}
    .divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0;}
    /* Password strength meter */
    .strength-bar{height:4px;border-radius:2px;background:#e2e8f0;margin-top:.4rem;overflow:hidden;}
    .strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0;}
    .strength-label{font-size:.75rem;margin-top:.25rem;color:var(--text-muted);}
    /* View toggle for password */
    .pw-wrap{position:relative;}
    .pw-wrap .form-control{padding-right:2.5rem;}
    .pw-eye{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1.1rem;padding:0;}
    @media(max-width:480px){.auth-card{padding:2rem 1.5rem;}.navbar{padding:1rem;}}
  </style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">skipQs</a>
  <a href="login.html" class="navbar-back">← Back to login</a>
</header>

<!-- STATE 1: Request reset email -->
<main class="auth-wrapper" id="requestView">
  <div class="auth-card">
    <span class="auth-icon">🔐</span>
    <div class="auth-header">
      <h1>Forgot password?</h1>
      <p>Enter your email and we'll send you a secure link to reset your password.</p>
    </div>

    <div id="reqAlert" class="alert"></div>

    <form id="requestForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="reqEmail" class="form-control" placeholder="name@email.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn-submit" id="reqBtn">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="login.html">Sign in</a>
    </div>
    <div class="auth-footer" style="margin-top:.6rem;font-size:.82rem;">
      New to skipQs? <a href="signup.html">Create account</a>
    </div>
  </div>
</main>

<!-- STATE 2: Set new password (after clicking email link) -->
<main class="auth-wrapper" id="resetView" style="display:none;">
  <div class="auth-card">
    <span class="auth-icon">🔑</span>
    <div class="auth-header">
      <h1>Set new password</h1>
      <p>Choose a strong password for your skipQs account.</p>
    </div>

    <div id="resetAlert" class="alert"></div>

    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="pw-wrap">
          <input type="password" id="newPw" class="form-control" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-eye" onclick="togglePw('newPw',this)">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirmPw" class="form-control" placeholder="Repeat your password" required autocomplete="new-password">
          <button type="button" class="pw-eye" onclick="togglePw('confirmPw',this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="resetBtn">Update Password</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>

<script>
/* ─── Helpers ─── */
function showAlert(id, msg, kind='error') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'alert alert-' + kind;
  el.style.display = 'block';
}
function hideAlert(id) { document.getElementById(id).style.display = 'none'; }

function togglePw(inputId, btn) {
  const inp = document.getElementById(inputId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

/* ─── Password strength ─── */
document.getElementById('newPw').addEventListener('input', function() {
  const val = this.value;
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^a-zA-Z0-9]/.test(val)) score++;
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  const levels = [
    { w:'25%', bg:'#dc2626', text:'Weak' },
    { w:'50%', bg:'#d97706', text:'Fair' },
    { w:'75%', bg:'#f59e0b', text:'Good' },
    { w:'100%', bg:'#059669', text:'Strong ✓' },
  ];
  if (!val) { fill.style.width='0'; label.textContent=''; return; }
  const lvl = levels[Math.min(score-1, 3)] || levels[0];
  fill.style.width = lvl.w;
  fill.style.background = lvl.bg;
  label.textContent = lvl.text;
  label.style.color = lvl.bg;
});

/* ─── Detect recovery token in URL hash ─── */
function parseHash() {
  const hash = window.location.hash.substring(1);
  const params = {};
  hash.split('&').forEach(pair => {
    const [k,v] = pair.split('=');
    if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return params;
}

window.addEventListener('DOMContentLoaded', async () => {
  const hash = parseHash();
  if (hash.type === 'recovery' && hash.access_token) {
    // Set the session from the recovery token
    await sb.auth.setSession({ access_token: hash.access_token, refresh_token: hash.refresh_token || '' });
    document.getElementById('requestView').style.display = 'none';
    document.getElementById('resetView').style.display = 'flex';
    // Clean up URL
    history.replaceState(null, '', window.location.pathname);
  }
});

/* ─── State 1: Request reset email ─── */
document.getElementById('requestForm').onsubmit = async (e) => {
  e.preventDefault();
  hideAlert('reqAlert');
  const btn = document.getElementById('reqBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const email = document.getElementById('reqEmail').value.trim();
  const redirectTo = window.location.origin + '/forgot-password.html';

  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

  if (error) {
    showAlert('reqAlert', error.message);
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
    return;
  }

  showAlert('reqAlert',
    '✓ Check your inbox! We sent a password reset link to ' + email + '. It expires in 1 hour.',
    'success');
  btn.textContent = 'Email sent ✓';
};

/* ─── State 2: Set new password ─── */
document.getElementById('resetForm').onsubmit = async (e) => {
  e.preventDefault();
  hideAlert('resetAlert');

  const pw = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;

  if (pw !== confirm) {
    showAlert('resetAlert', 'Passwords do not match.');
    return;
  }
  if (pw.length < 8) {
    showAlert('resetAlert', 'Password must be at least 8 characters.');
    return;
  }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  btn.textContent = 'Updating…';

  const { error } = await sb.auth.updateUser({ password: pw });

  if (error) {
    showAlert('resetAlert', error.message);
    btn.disabled = false;
    btn.textContent = 'Update Password';
    return;
  }

  showAlert('resetAlert', '✓ Password updated! Redirecting you to login…', 'success');
  setTimeout(() => { window.location.href = 'login.html'; }, 2000);
};
</script>
</body>
</html>
